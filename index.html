<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Destina — Gestão da Reserva Técnica</title>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#EDF1F6; --panel:#FFFFFF; --panel-2:#F6F8FB; --ink:#0E1A2B; --ink-2:#46536A; --muted:#7A8699;
  --line:#DCE3EC; --line-2:#E9EEF4;
  --brand:#0B3A75; --brand-ink:#FFFFFF; --brand-2:#1F5FAF; --brand-soft:#E3ECF8;
  --accent:#0E8C7E; --accent-soft:#DDF3EF;
  --good:#0ca30c; --good-ink:#006300; --good-soft:#E3F5E3;
  --warn:#fab219; --warn-ink:#8A5A00; --warn-soft:#FEF4DC;
  --serious:#ec835a; --serious-ink:#A13F16; --serious-soft:#FDEBE3;
  --crit:#d03b3b; --crit-ink:#A82525; --crit-soft:#FBE6E6;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --q250:#86b6ef; --q350:#5598e7; --q450:#2a78d6; --q550:#1c5cab; --q650:#104281;
  --grid:#e1e0d9; --shadow:0 1px 2px rgba(14,26,43,.06),0 4px 16px rgba(14,26,43,.05);
  --r-sm:6px; --r:10px; --r-lg:16px;
  --side-w:248px;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B111D; --panel:#131B2A; --panel-2:#182234; --ink:#E8EDF5; --ink-2:#AEB9CB; --muted:#7F8BA0;
  --line:#25314A; --line-2:#1E293D;
  --brand:#0A2650; --brand-2:#6EA4F0; --brand-soft:#16294A;
  --accent:#2CC2AE; --accent-soft:#103530;
  --good-ink:#0ca30c; --good-soft:#123018; --warn-ink:#fab219; --warn-soft:#33280C; --serious-ink:#ec835a; --serious-soft:#3A2018; --crit-ink:#e66767; --crit-soft:#3A1818;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --q250:#184f95; --q350:#1c5cab; --q450:#2a78d6; --q550:#5598e7; --q650:#86b6ef;
  --grid:#2c2c2a; --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand-2)}
:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3,h4{margin:0;line-height:1.25;letter-spacing:-.01em}
h1{font-size:26px;font-weight:800}
h2{font-size:18px;font-weight:700}
h3{font-size:15px;font-weight:700}
p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- layout ---------- */
#app{display:flex;min-height:100vh}
#side{width:var(--side-w);flex:none;background:var(--brand);color:#D9E4F5;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 14px}
.logo{display:flex;gap:10px;align-items:center;padding:4px 8px 18px}
.logo b{display:block;color:#fff;font-size:19px;font-weight:800;letter-spacing:-.02em}
.logo small{display:block;font-size:11.5px;color:#A9BEDD;line-height:1.3}
.nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:8px;color:#D2DEF1;text-decoration:none;font-weight:500;font-size:14px}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a[aria-current="page"]{background:#fff;color:var(--brand);font-weight:700}
:root[data-theme="dark"] .nav a[aria-current="page"]{background:#1F3D6E;color:#fff}
.nav a svg{width:18px;height:18px;flex:none}
.nav .badge{margin-left:auto}
.nav-sep{height:1px;background:rgba(255,255,255,.1);margin:10px 6px}
.env-card{margin-top:10px;padding:12px;border-radius:10px;background:rgba(255,255,255,.07);font-size:12.5px;color:#C4D3EA}
.env-card b{color:#fff;display:block;font-size:13px}
.env-card button{margin-top:8px;width:100%}
#main-wrap{flex:1;min-width:0;display:flex;flex-direction:column}
#top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 24px;min-height:62px}
#top .search{flex:1;max-width:520px;display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--muted);cursor:pointer;text-align:left}
#top .search span{flex:1}
#top .search svg{width:18px;height:18px;flex:none}
kbd{font-family:inherit;font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--ink-2);background:var(--panel-2)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.mode-chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:99px;border:1px solid var(--line);background:var(--panel);cursor:pointer}
.mode-chip i{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.mode-chip.oficial i{background:var(--good)}
.who{display:flex;align-items:center;gap:10px;padding:4px 6px 4px 4px;border-radius:99px;border:1px solid var(--line);background:var(--panel);cursor:pointer}
.who .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff;background:var(--brand-2);flex:none;overflow:hidden}
.who .av img{width:100%;height:100%}
.who .t{line-height:1.15;text-align:left;padding-right:6px}
.who .t b{font-size:13px;display:block;max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .t small{font-size:11.5px;color:var(--muted)}
#view{padding:24px;max-width:1440px;width:100%;margin:0 auto 90px}
#bottom{display:none}

/* ---------- primitives ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:8px;font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--brand-2)}
.btn svg{width:16px;height:16px;flex:none}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
:root[data-theme="dark"] .btn.primary{background:#2A64B8;border-color:#2A64B8}
.btn.primary:hover{filter:brightness(1.12)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--crit-ink);border-color:color-mix(in srgb,var(--crit) 40%,var(--line))}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--panel-2)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{width:36px;height:36px;padding:0;border-radius:9px}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:99px;font-size:11.5px;font-weight:700;background:var(--crit);color:#fff}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--panel-2);color:var(--ink-2);border:1px solid var(--line-2);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.st-RASCUNHO{color:#5B6578;background:var(--panel-2)}
.st-INSTRUCAO{color:#6250d6;background:color-mix(in srgb,#6250d6 12%,var(--panel))}
.st-AUTORIZACAO{color:var(--warn-ink);background:var(--warn-soft)}
.st-AUTORIZADO{color:var(--brand-2);background:var(--brand-soft)}
.st-SEPARACAO{color:#0E7C8C;background:color-mix(in srgb,#0E7C8C 12%,var(--panel))}
.st-PRONTO{color:var(--accent);background:var(--accent-soft)}
.st-ENTREGUE{color:var(--good-ink);background:var(--good-soft)}
.st-INDEFERIDO,.st-CANCELADO{color:var(--crit-ink);background:var(--crit-soft)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:16px 18px 0}
.card-h .sub{color:var(--muted);font-size:12.5px}
.card-h .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.card-b{padding:14px 18px 18px}
.page-h{display:flex;align-items:flex-end;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-h p{color:var(--ink-2);margin-top:4px;max-width:70ch}
.page-h .r{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;gap:16px;align-items:start}
.g-12{grid-template-columns:repeat(12,minmax(0,1fr))}
.c-3{grid-column:span 3}.c-4{grid-column:span 4}.c-5{grid-column:span 5}.c-6{grid-column:span 6}.c-7{grid-column:span 7}.c-8{grid-column:span 8}.c-12{grid-column:span 12}
.muted{color:var(--muted)}.ink2{color:var(--ink-2)}
.small{font-size:12.5px}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}
.sp{flex:1}
.empty{padding:36px 18px;text-align:center;color:var(--ink-2)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.empty .btn{margin-top:12px}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}

/* inputs */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.field .hint{font-size:12px;color:var(--muted)}
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 10px;outline:none;min-height:38px}
.inp:focus{border-color:var(--brand-2);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand-2) 18%,transparent)}
textarea.inp{min-height:84px;resize:vertical}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.form-grid .full{grid-column:1/-1}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;cursor:pointer}
.check input{margin-top:3px;width:16px;height:16px;accent-color:var(--brand-2)}
.seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:7px;font-weight:600;font-size:12.5px;cursor:pointer;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .inp{width:auto;min-width:160px}
.toolbar .q{flex:1;min-width:220px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-bottom:16px}
.kpi{padding:16px 18px}
.kpi .l{font-size:12.5px;color:var(--ink-2);font-weight:600}
.kpi .v{font-size:27px;font-weight:800;letter-spacing:-.02em;margin-top:4px;line-height:1.1}
.kpi .d{font-size:12.5px;color:var(--muted);margin-top:4px}

/* trilho */
.rail-wrap{padding:22px 22px 18px;background:linear-gradient(180deg,var(--brand) 0%,#0F4A92 100%);color:#fff;border:0;overflow:hidden;position:relative}
:root[data-theme="dark"] .rail-wrap{background:linear-gradient(180deg,#0E2A55,#12366B)}
.rail-wrap h2{font-size:21px;font-weight:800}
.rail-wrap .lead{color:#BFD2EE;margin-top:3px;font-size:13.5px}
.rail{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));margin-top:22px;position:relative}
.rail::before{content:"";position:absolute;left:calc(100%/14);right:calc(100%/14);top:15px;height:4px;border-radius:4px;background:rgba(255,255,255,.18)}
.station{position:relative;text-align:center;padding:0 4px;cursor:pointer;border-radius:10px}
.station .dot{width:34px;height:34px;margin:0 auto;border-radius:50%;background:#123F7C;border:3px solid rgba(255,255,255,.35);display:grid;place-items:center;font-weight:800;font-size:13px;position:relative;z-index:1;transition:transform .15s}
.station.has .dot{background:#fff;color:var(--brand);border-color:#fff}
.station.late .dot{box-shadow:0 0 0 4px rgba(250,178,25,.55)}
.station:hover .dot{transform:scale(1.08)}
.station .nm{margin-top:9px;font-weight:700;font-size:12.5px;line-height:1.2}
.station .vl{font-size:12px;color:#BFD2EE;margin-top:2px}
.station .lt{font-size:11.5px;color:#FFD679;margin-top:2px;font-weight:600}
.trains{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-top:8px;min-height:10px}
.trains span{width:8px;height:8px;border-radius:2px;background:rgba(255,255,255,.6)}
.rail-foot{display:flex;gap:22px;flex-wrap:wrap;margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,.14);font-size:13px;color:#D3E1F4}
.rail-foot b{color:#fff;font-size:15px}

/* plan mini rail */
.mrail{display:flex;align-items:flex-start;gap:0;margin:6px 0 4px;overflow-x:auto;padding-bottom:4px}
.mrail .s{flex:1;min-width:86px;text-align:center;position:relative;font-size:11.5px;color:var(--muted);font-weight:600}
.mrail .s::before{content:"";position:absolute;top:10px;left:-50%;right:50%;height:3px;background:var(--line)}
.mrail .s:first-child::before{display:none}
.mrail .s .d{width:22px;height:22px;border-radius:50%;margin:0 auto 6px;background:var(--panel);border:2px solid var(--line);position:relative;z-index:1;display:grid;place-items:center}
.mrail .s.done{color:var(--ink-2)}
.mrail .s.done .d{background:var(--accent);border-color:var(--accent)}
.mrail .s.done::before,.mrail .s.cur::before{background:var(--accent)}
.mrail .s.cur{color:var(--ink)}
.mrail .s.cur .d{border-color:var(--brand-2);background:var(--brand-soft);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand-2) 20%,transparent)}
.mrail .s.stop .d{background:var(--crit);border-color:var(--crit)}
.mrail svg{width:12px;height:12px;color:#fff}
.mrail small{display:block;font-weight:500;color:var(--muted);font-size:11px}

/* charts */
.hbars{display:flex;flex-direction:column;gap:9px}
.hbar{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) auto;gap:10px;align-items:center;font-size:12.5px;cursor:default}
.hbar .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.hbar .tr{height:14px;position:relative}
.hbar .fl{position:absolute;left:0;top:0;bottom:0;background:var(--s1);border-radius:0 4px 4px 0;min-width:3px}
.hbar .vl{font-weight:700;font-size:12.5px;text-align:right;white-space:nowrap}
.hbar:hover .fl{filter:brightness(1.1)}
.vbars{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:20px;border-bottom:1px solid var(--grid);position:relative}
.vbar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.vbar .fl{width:100%;max-width:46px;border-radius:4px 4px 0 0;background:var(--s1);min-height:2px}
.vbar .vl{font-size:11.5px;font-weight:700;margin-bottom:4px;white-space:nowrap}
.vlabels{display:flex;gap:10px;margin-top:6px}
.vlabels span{flex:1;text-align:center;font-size:11.5px;color:var(--muted)}
.stack{display:flex;height:22px;border-radius:5px;overflow:hidden;gap:2px;background:var(--panel)}
.stack div{height:100%;min-width:2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
#tip{position:fixed;z-index:200;pointer-events:none;background:var(--ink);color:var(--panel);font-size:12.5px;padding:7px 10px;border-radius:8px;max-width:280px;opacity:0;transition:opacity .1s;line-height:1.4}
#tip.on{opacity:1}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:grid;align-items:center;gap:12px;padding:12px 18px;border-top:1px solid var(--line-2);cursor:pointer}
.li:hover{background:var(--panel-2)}
.li:first-child{border-top:0}
.items-head,.items-row{grid-template-columns:minmax(0,3fr) minmax(0,1.2fr) 90px 90px 90px 120px 130px}
.items-head{cursor:default;font-size:12px;font-weight:700;color:var(--muted);padding-top:8px;padding-bottom:8px}
.items-head:hover{background:none}
.items-head button{all:unset;cursor:pointer}
.items-head button:hover{color:var(--ink)}
.r-al{text-align:right}
.it-t b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it-t small{color:var(--muted);font-size:12px}
.mini-stack{display:flex;height:6px;border-radius:3px;overflow:hidden;gap:1px;margin-top:6px;background:var(--line-2);max-width:260px}
.plans-row{grid-template-columns:120px minmax(0,2.4fr) minmax(0,1.3fr) 130px 170px}
.alert{display:flex;gap:12px;padding:12px 14px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel-2);align-items:flex-start}
.alert+.alert{margin-top:8px}
.alert .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none}
.alert .ic svg{width:16px;height:16px}
.alert.critical .ic{background:var(--crit-soft);color:var(--crit-ink)}
.alert.serious .ic{background:var(--serious-soft);color:var(--serious-ink)}
.alert.warning .ic{background:var(--warn-soft);color:var(--warn-ink)}
.alert.good .ic{background:var(--good-soft);color:var(--good-ink)}
.alert b{display:block;font-size:13.5px}
.alert p{font-size:12.5px;color:var(--ink-2)}
.alert .sev{font-size:11.5px;font-weight:700}
.alert.critical .sev{color:var(--crit-ink)}.alert.serious .sev{color:var(--serious-ink)}.alert.warning .sev{color:var(--warn-ink)}

/* kanban */
.kanban{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:200px}
.col h3{display:flex;align-items:center;gap:8px;font-size:13.5px;margin-bottom:10px}
.col h3 .badge{background:var(--ink-2)}
.kc{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;cursor:pointer;box-shadow:var(--shadow)}
.kc:hover{border-color:var(--brand-2)}
.kc b{font-size:13.5px}
.kc .m{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.kc .f{display:flex;justify-content:space-between;margin-top:10px;font-size:12px;color:var(--muted)}
.kc .act{margin-top:10px}

/* timeline */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.ev{position:relative;padding-bottom:14px}
.ev::before{content:"";position:absolute;left:-21px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--panel);border:2px solid var(--brand-2)}
.ev.sig::before{background:var(--accent);border-color:var(--accent)}
.ev.bad::before{background:var(--crit);border-color:var(--crit)}
.ev b{font-size:13.5px}
.ev .m{font-size:12.5px;color:var(--ink-2)}
.ev .h{font-size:11px;color:var(--muted);word-break:break-all}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-size:12px;color:var(--muted);text-align:left;font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px;border-bottom:1px solid var(--line-2);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl .r-al{text-align:right}
.tbl-wrap{overflow-x:auto}

/* drawer & modal */
.scrim{position:fixed;inset:0;background:rgba(8,15,28,.45);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(12px);opacity:0}}

// ---------- lotes de entrada ----------
const normName = v => String(v || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, " ").trim().toUpperCase();
function lotsOf(it) {
  if (Array.isArray(it.lotes) && it.lotes.length) return it.lotes;
  return [{id:"l0", data:it.dataEntrada, qtd:+it.qtdRecebida || 0, vu:+it.valorUnitario || 0, empenho:it.empenho || "", processo:it.processoAquisicao || "", requisicao:"", pregao:"", obs:"", nf:it.notaFiscal || ""}];
}
function syncItem(it) {
  const ls = lotsOf(it);
  it.qtdRecebida = ls.reduce((a, l) => a + (+l.qtd || 0), 0);
  const priced = ls.filter(l => +l.vu > 0);
  const pq = priced.reduce((a, l) => a + (+l.qtd || 0), 0);
  it.valorUnitario = pq ? +(priced.reduce((a, l) => a + l.qtd * l.vu, 0) / pq).toFixed(2) : 0;
  it.semValor = !priced.length;
  it.valorParcial = !!priced.length && priced.length < ls.length;
  it.dataEntrada = Math.min(...ls.map(l => l.data || now()));
  const last = ls.slice().sort((a, b) => (b.data || 0) - (a.data || 0))[0] || {};
  if (last.empenho) it.empenho = last.empenho;
  if (last.processo) it.processoAquisicao = last.processo;
  return it;
}
function guessCat(n) {
  n = normName(n);
  if (/AR CONDICIONADO|CLIMATIZADOR|SPLIT/.test(n)) return "Climatização";
  if (/CAFETEIRA|SANDUICHEIRA|FRITADEIRA|MICROONDAS|MICRO-ONDAS|REFRIGERADOR|FREEZER|GELADEIRA|FOGAO|FORNO|LIQUIDIFICADOR/.test(n)) return "Copa e cozinha";
  if (/BEBEDOURO|VENTILADOR|ASPIRADOR|TELEVIS|\bTV\b/.test(n)) return "Eletroeletrônicos";
  if (/PROJE|LOUSA DIGITAL|CAIXA DE SOM|MICROFONE/.test(n)) return "Audiovisual";
  if (/COMPUTADOR|NOTEBOOK|MONITOR|IMPRESSORA|NOBREAK|SWITCH|TABLET/.test(n)) return "Informática";
  if (/FURADEIRA|PARAFUSADEIRA|SERRA|ESMERILHADEIRA|ESCADA/.test(n)) return "Ferramentas";
  if (/CADEIRA|MESA|ARMARIO|ESTACAO DE TRABALHO|QUADRO|LOUSA|BIBLIOCANTO|APOIO|ESTANTE|LONGARINA|GAVETEIRO|SOFA|BALCAO/.test(n)) return "Mobiliário";
  if (/MICROSCOPIO|BALANCA|CAPELA|ESTUFA|CENTRIFUGA/.test(n)) return "Laboratório";
  return "Outros";
}

// ---------- cálculo de estoque ----------
function computeStock() {
  const m = {};
  for (const it of Object.values(S.items)) m[it.id] = {rec:+it.qtdRecebida || 0, comp:0, res:0, ent:0, rasc:0};
  for (const p of Object.values(S.plans)) {
    for (const li of (p.itens || [])) {
      const s = m[li.itemId]; if (!s) continue;
      if (COMPROMETE.includes(p.status)) s.comp += li.qtd;
      else if (RESERVA.includes(p.status)) s.res += li.qtd;
      else if (p.status === "ENTREGUE") s.ent += li.qtd;
      else if (p.status === "RASCUNHO") s.rasc += li.qtd;
    }
  }
  for (const id in m) {
    const s = m[id]; s.disp = s.rec - s.comp - s.res - s.ent; s.saldo = s.rec - s.ent;
    // idade do saldo pelo lote mais antigo ainda não consumido (FIFO)
    const ls = lotsOf(S.items[id]).slice().sort((a, b) => (a.data || 0) - (b.data || 0));
    let rem = s.comp + s.res + s.ent; s.age = ls.length ? ls[ls.length - 1].data : S.items[id].dataEntrada;
    for (const l of ls) { if (rem >= l.qtd) rem -= l.qtd; else { s.age = l.data; break; } }
  }
  return m;
}
const planTotal = p => (p.itens || []).reduce((a, li) => a + li.qtd * li.vu, 0);
const planQtd = p => (p.itens || []).reduce((a, li) => a + li.qtd, 0);
function requiredSigners(total) {
  if (S.cfg.exigirAmbos || total > S.cfg.limiteAlcada) return ["PRA", "REITORIA"];
  return ["PRA"];
}
function stageEnteredAt(p) { const e = (p.etapas || []).slice().reverse().find(x => x.s === p.status); return e ? e.at : p.criadoEm; }
function isLate(p) { const sla = S.cfg.sla[p.status]; return sla && STAGES.includes(p.status) && p.status !== "ENTREGUE" && daysSince(stageEnteredAt(p)) > sla; }
function nextSigner(p) {
  if (p.status !== "AUTORIZACAO") return null;
  const req = p.assinaturasExigidas || ["PRA"];
  const pend = req.filter(r => !(p.assinaturas || {})[r]);
  if (!pend.length) return null;
  return S.cfg.sequencial ? [pend[0]] : pend;
}
function docPayload(p) {
  return JSON.stringify({numero:p.numero, unidade:p.unidade, finalidade:p.finalidade, justificativa:p.justificativa, processo:p.processo || "", fundamentacao:p.fundamentacao || "",
    itens:(p.itens || []).map(li => [li.codigo, li.descricao, li.qtd, li.vu]), total:+planTotal(p).toFixed(2), exigidas:p.assinaturasExigidas || []});
}

const R = () => S.role;
const has = (...rs) => rs.includes(R());
const can = {
  createPlan: () => has("PATRIMONIO","FORMALIZACAO","ADMIN"),
  editItems: () => has("PATRIMONIO","ALMOXARIFADO","ADMIN"),
  formalize: () => has("FORMALIZACAO","ADMIN"),
  separate: () => has("ALMOXARIFADO","ADMIN"),
  deliver: () => has("PATRIMONIO","ALMOXARIFADO","ADMIN"),
  admin: () => has("ADMIN"),
  sign: p => { const n = nextSigner(p); return !!n && n.includes(R()); }
};
function myPending() {
  const out = [];
  for (const p of Object.values(S.plans)) {
    if (p.status === "AUTORIZACAO" && can.sign(p)) out.push({p, a:"Assinar autorização"});
    else if (p.status === "INSTRUCAO" && can.formalize()) out.push({p, a:"Formalizar e submeter"});
    else if (p.status === "AUTORIZADO" && can.separate()) out.push({p, a:"Iniciar separação"});
    else if (p.status === "SEPARACAO" && can.separate()) out.push({p, a:"Concluir conferência"});
    else if (p.status === "PRONTO" && can.deliver() && R() !== "ALMOXARIFADO") out.push({p, a:"Registrar entrega"});
    else if (p.status === "PRONTO" && R() === "ALMOXARIFADO") out.push({p, a:"Entregar com o Patrimônio"});
    else if (p.status === "RASCUNHO" && can.createPlan() && R() !== "FORMALIZACAO" && p.criadoPor === S.me.id) out.push({p, a:"Concluir rascunho"});
  }
  return out.sort((a, b) => stageEnteredAt(a.p) - stageEnteredAt(b.p));
}

// ---------- persistência ----------
const writeQueue = {};
function queueWrite(path, fn) {
  const prev = writeQueue[path] || Promise.resolve();
  const next = prev.catch(() => {}).then(fn);
  writeQueue[path] = next;
  return next;
}
async function persist(col, id, obj) {
  if (S.mode === "oficial") { toast("Ação indisponível no ambiente oficial.", true); console.error("persist em modo oficial", col, id); return false; }
  if (col === "itens") S.items[id] = obj;
  else if (col === "planos") S.plans[id] = obj;
  if (S.mode === "demo") { saveDemo(); return true; }
  try {
    await queueWrite(col + "/" + id, () => CAP.db.doc(col + "/" + id).set(clone(obj)));
    return true;
  } catch (e) { handleDbError(e); return false; }
}
async function removeDoc(col, id) {
  if (col === "itens") delete S.items[id];
  if (S.mode === "demo") { saveDemo(); return; }
  try { await queueWrite(col + "/" + id, () => CAP.db.doc(col + "/" + id).delete()); } catch (e) { handleDbError(e); }
}
async function persistCfg(cfg) {
  if (S.mode === "oficial") { const d = clone(cfg); delete d.unidades; return !!(await sbDo("salvar_config", {p_dados:d}, null)); }
  S.cfg = cfg; saveDemo(); return true;
}

// ---------- eventos com cadeia de hash ----------
async function addEvent(p, tipo, msg, extra = {}) {
  p.eventos = p.eventos || [];
  const prev = p.eventos.length ? p.eventos[p.eventos.length - 1].h : "0".repeat(64);
  const ev = {at:extra.at || now(), by:extra.by || S.me.id, role:extra.role || S.role, tipo, msg};
  ev.prev = prev;
  ev.h = await sha256(prev + "|" + ev.at + "|" + ev.by + "|" + ev.role + "|" + tipo + "|" + msg);
  p.eventos.push(ev);
  return ev;
}
async function verifyChain(p) {
  let prev = "0".repeat(64);
  for (const ev of (p.eventos || [])) {
    if (ev.prev !== prev) return false;
    const h = await sha256(prev + "|" + ev.at + "|" + ev.by + "|" + ev.role + "|" + ev.tipo + "|" + ev.msg);
    if (h !== ev.h) return false;
    prev = h;
  }
  return true;
}
function setStatus(p, s, at) { p.status = s; p.etapas = p.etapas || []; p.etapas.push({s, at:at || now()}); }

      <div class="trains">${ps.slice(0, 8).map(() => "<span></span>").join("")}</div></div>`;

  });

    <div class="card kpi"><div class="l">Entregue em 30 dias</div><div class="v num">${fmtN(ent30q)}</div><div class="d">${plural(ent30.length, "plano")} concluídos · ${BRLc(ent30.reduce((a, p) => a + planTotal(p), 0))}</div></div>

    <div class="card kpi"><div class="l">Aguardando assinatura</div><div class="v num">${byStage.AUTORIZACAO.length}</div><div class="d">${BRLc(byStage.AUTORIZACAO.reduce((a, p) => a + planTotal(p), 0))} a autorizar</div></div>
  </div>

  <div class="grid g-12">
    <section class="card c-7"><div class="card-h"><h3>Itens com maior saldo disponível</h3><span class="sub">quantidade sem destinação</span><div class="r"><a class="btn sm ghost" href="#reserva">Ver reserva</a></div></div>
      <div class="card-b"><div class="hbars">${top.length ? top.map(x => `<div class="hbar" data-tip="${esc(x.it.descricao)}<br>${fmtN(x.s.disp)} disponíveis · ${BRL.format(x.s.disp * x.it.valorUnitario)}<br>Saldo mais antigo com ${daysSince(x.s.age)} dias em estoque" data-act="item" data-id="${x.it.id}" style="cursor:pointer"><span class="lb">${esc(x.it.descricao)}</span><span class="tr"><span class="fl" style="width:${(x.s.disp / maxT * 100).toFixed(1)}%"></span></span><span class="vl num">${fmtN(x.s.disp)}</span></div>`).join("") : `<div class="empty"><b>Nenhum saldo disponível</b>Todos os bens já têm destinação.</div>`}</div></div></section>
    <section class="card c-5"><div class="card-h"><h3>Minhas pendências</h3><span class="sub">${esc(ROLES[S.role].label)}</span></div>
      <div class="card-b" style="padding-top:8px">${pend.length ? pend.slice(0, 6).map(x => `<div class="alert ${isLate(x.p) ? "warning" : "good"}" data-act="plan" data-id="${x.p.id}" style="cursor:pointer"><div class="ic">${ic(isLate(x.p) ? "clock" : "check")}</div><div style="min-width:0;flex:1"><b>${esc(x.a)} · ${esc(x.p.numero)}</b><p>${esc(x.p.unidade)} · ${BRL.format(planTotal(x.p))}</p><span class="small muted">${daysSince(stageEnteredAt(x.p))} dia(s) nesta etapa${isLate(x.p) ? " · acima do prazo" : ""}</span></div></div>`).join("") + (pend.length > 6 ? `<p class="small muted" style="margin-top:8px">e mais ${pend.length - 6}…</p>` : "") : `<div class="empty"><b>Tudo em dia</b>Quando um plano chegar à sua etapa, ele aparece aqui.</div>`}</div></section>

    <section class="card c-4"><div class="card-h"><h3>Valor disponível por categoria</h3></div>
      <div class="card-b"><div class="hbars">${cats.map(([c, v]) => `<div class="hbar" style="grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) auto" data-tip="${esc(c)}: ${BRL.format(v)}"><span class="lb">${esc(c)}</span><span class="tr"><span class="fl" style="width:${(v / maxC * 100).toFixed(1)}%"></span></span><span class="vl num">${BRLc(v)}</span></div>`).join("") || '<p class="muted">Sem saldo.</p>'}</div></div></section>
    <section class="card c-4"><div class="card-h"><h3>Idade do saldo disponível</h3><span class="sub">valor por tempo em estoque</span></div>
      <div class="card-b"><div class="vbars">${bk.map(b => `<div class="vbar" data-tip="${b.l}: ${BRL.format(b.v)} · ${plural(b.q, "bem", "bens")}"><span class="vl num">${b.v ? BRLc(b.v) : ""}</span><span class="fl" style="height:${(b.v / maxB * 100).toFixed(1)}%;background:var(${b.c})"></span></div>`).join("")}</div><div class="vlabels">${bk.map(b => `<span>${b.l}</span>`).join("")}</div></div></section>
    <section class="card c-4"><div class="card-h"><h3>Bens entregues por mês</h3><span class="sub">últimos 6 meses</span></div>
      <div class="card-b"><div class="vbars">${months.map(m => `<div class="vbar" data-tip="${m.l}: ${plural(m.q, "bem entregue", "bens entregues")} · ${BRL.format(m.v)}"><span class="vl num">${m.q || ""}</span><span class="fl" style="height:${(m.q / maxM * 100).toFixed(1)}%"></span></div>`).join("")}</div><div class="vlabels">${months.map(m => `<span>${m.l}</span>`).join("")}</div></div></section>

    <section class="card c-7"><div class="card-h"><h3>Para onde está indo a reserva</h3><span class="sub">valor acumulado por situação</span></div>
      <div class="card-b"><div class="stack">${comp.map(([l, v, c]) => v > 0 ? `<div style="width:${(v / tTot * 100).toFixed(2)}%;background:var(${c})" data-tip="${l}: ${BRL.format(v)} (${(v / tTot * 100).toFixed(1)}%)"></div>` : "").join("")}</div>
      <div class="legend">${comp.map(([l, v, c]) => `<span><i style="background:var(${c})"></i>${l} <b class="num">${(v / tTot * 100).toFixed(0)}%</b></span>`).join("")}</div></div></section>
    <section class="card c-5"><div class="card-h"><h3>Alertas</h3><div class="r"><a class="btn sm ghost" href="#monitoramento">Ver todos</a></div></div>
      <div class="card-b" style="padding-top:8px">${alerts.length ? alerts.map(alertHtml).join("") : `<div class="empty"><b>Sem alertas</b>Nenhum prazo estourado ou bem parado.</div>`}</div></section>
  </div>`;
}

// ---------- alertas ----------
function buildAlerts() {
  const st = computeStock(); const out = [];
  for (const it of Object.values(S.items)) {
    const s = st[it.id]; const d = daysSince(s.age);
    if (s.disp < 0) out.push({sev:"critical", t:"Saldo negativo: " + it.descricao, m:`Os planos em trâmite pedem ${fmtN(-s.disp)} unidade(s) a mais do que existe em reserva. Revise as quantidades.`, act:"item", id:it.id, w:4});
    if (s.saldo > 0 && it.garantiaAte && it.garantiaAte < now()) out.push({sev:"critical", t:"Garantia vencida em estoque: " + it.descricao, m:`${fmtN(s.saldo)} unidade(s) perderam a garantia em ${fmtD(it.garantiaAte)} sem terem sido entregues.`, act:"item", id:it.id, w:3});
    else if (s.saldo > 0 && it.garantiaAte && it.garantiaAte - now() < S.cfg.diasGarantia * DAY) out.push({sev:"serious", t:"Garantia vence em " + Math.ceil((it.garantiaAte - now()) / DAY) + " dias: " + it.descricao, m:`${fmtN(s.saldo)} unidade(s) ainda em reserva. Priorize a destinação para não perder a garantia.`, act:"item", id:it.id, w:2.5});
    if (s.disp > 0 && d > S.cfg.diasParado) out.push({sev:"warning", t:`Parado há ${d} dias: ${it.descricao}`, m:`${fmtN(s.disp)} unidade(s) sem destinação · ${BRL.format(s.disp * it.valorUnitario)} imobilizados.`, act:"item", id:it.id, w:1 + d / 1000});
  }
  const sv = Object.values(S.items).filter(it => it.semValor && st[it.id].saldo > 0);
  if (sv.length) out.push({sev:"warning", t:`${plural(sv.length, "material", "materiais")} sem valor unitário`, m:`O valor da reserva está subestimado. Informe o valor em uma entrada: ${esc(sv.slice(0, 4).map(it => it.descricao).join(", "))}${sv.length > 4 ? "…" : ""}.`, act:"item", id:sv[0].id, w:1.5});
  for (const p of Object.values(S.plans)) {
    if (isLate(p)) out.push({sev:"warning", t:`${p.numero} parado em "${ST[p.status].l}"`, m:`${daysSince(stageEnteredAt(p))} dias na etapa; o prazo é de ${S.cfg.sla[p.status]} dias. ${esc(p.unidade)}.`, act:"plan", id:p.id, w:2});
  }
  const o = {critical:0, serious:1, warning:2};
  return out.sort((a, b) => o[a.sev] - o[b.sev] || b.w - a.w);
}
const SEV = {critical:"Crítico", serious:"Grave", warning:"Atenção"};
function alertHtml(a) { return `<div class="alert ${a.sev}" data-act="${a.act}" data-id="${a.id}" style="cursor:pointer"><div class="ic">${ic(a.sev === "warning" ? "clock" : "alert")}</div><div style="min-width:0"><span class="sev">${SEV[a.sev]}</span><b>${esc(a.t)}</b><p>${a.m}</p></div></div>`; }

// ---------- RESERVA ----------
function vReserva() {
  const st = computeStock(); const u = S.ui;
  let items = Object.values(S.items);
  const q = u.q.trim().toLowerCase();
  if (q) items = items.filter(it => [it.descricao, it.codigo, it.marca, it.modelo, it.fornecedor, it.empenho, it.notaFiscal, it.localizacao].join(" ").toLowerCase().includes(q));
  if (u.cat) items = items.filter(it => it.categoria === u.cat);
  if (u.loc) items = items.filter(it => (it.localizacao || "").split("/")[0].trim() === u.loc);
  if (u.sit === "disp") items = items.filter(it => st[it.id].disp > 0);
  if (u.sit === "parado") items = items.filter(it => st[it.id].disp > 0 && daysSince(it.dataEntrada) > S.cfg.diasParado);
  if (u.sit === "esgotado") items = items.filter(it => st[it.id].disp <= 0);
  if (u.sit === "garantia") items = items.filter(it => st[it.id].saldo > 0 && it.garantiaAte && it.garantiaAte - now() < S.cfg.diasGarantia * DAY);
  const key = {desc:it => it.descricao.toLowerCase(), saldo:it => st[it.id].disp, rec:it => st[it.id].rec, valor:it => Math.max(0, st[it.id].disp) * it.valorUnitario, idade:it => -st[it.id].age, vu:it => it.valorUnitario}[u.sort] || (it => st[it.id].disp);
  items.sort((a, b) => { const x = key(a), y = key(b); return (x > y ? 1 : x < y ? -1 : 0) * u.dir; });
  const locs = [...new Set(Object.values(S.items).map(it => (it.localizacao || "").split("/")[0].trim()).filter(Boolean))].sort();
  const totV = items.reduce((a, it) => a + Math.max(0, st[it.id].disp) * it.valorUnitario, 0);
  const sh = (k, l, cls = "") => `<button class="${cls}" data-act="sort" data-k="${k}">${l}${u.sort === k ? (u.dir > 0 ? " ↑" : " ↓") : ""}</button>`;
  return `
  <div class="page-h"><div><h1>Reserva técnica</h1><p>Bens permanentes recebidos e ainda sob guarda do Almoxarifado, com o saldo livre para destinar descontando o que já está em trâmite.</p></div>
  <div class="r">${can.editItems() ? `<button class="btn" data-act="import">${ic("up")}Importar planilha</button><button class="btn primary" data-act="new-entry">${ic("plus")}Registrar entrada</button>` : ""}<button class="btn" data-act="export-csv">${ic("down")}Exportar CSV</button></div></div>
  <div class="toolbar">
    <input class="inp q" type="search" placeholder="Buscar por descrição, código, marca, empenho, nota fiscal…" value="${esc(u.q)}" data-ui="q" aria-label="Buscar itens">
    <select class="inp" data-ui="cat" aria-label="Categoria"><option value="">Todas as categorias</option>${CATS.map(c => `<option ${u.cat === c ? "selected" : ""}>${c}</option>`).join("")}</select>
    <select class="inp" data-ui="loc" aria-label="Local"><option value="">Todos os locais</option>${locs.map(c => `<option ${u.loc === c ? "selected" : ""}>${esc(c)}</option>`).join("")}</select>
    <div class="seg" role="group" aria-label="Situação">${[["","Todos"],["disp","Com saldo"],["parado","Parados"],["garantia","Garantia vencendo"],["esgotado","Sem saldo"]].map(([k, l]) => `<button aria-pressed="${u.sit === k}" data-act="sit" data-k="${k}">${l}</button>`).join("")}</div>
  </div>
  <p class="small muted" style="margin:-4px 0 10px">${plural(items.length, "item", "itens")} · ${BRL.format(totV)} disponíveis para destinação</p>
  <div class="card"><div class="list">
    <div class="li items-head">${sh("desc", "Item")}<span class="hide-md">${sh("idade", "Saldo desde")}</span><span class="r-al hide-sm">${sh("rec", "Recebido")}</span><span class="r-al hide-md">Em trâmite</span><span class="r-al">${sh("saldo", "Disponível")}</span><span class="r-al hide-sm">${sh("vu", "Valor unit.")}</span><span class="r-al">${sh("valor", "Valor disponível")}</span></div>
    ${items.map(it => { const s = st[it.id]; const d = daysSince(s.age); const tot = Math.max(1, s.rec);
      return `<div class="li items-row" data-act="item" data-id="${it.id}">
        <div class="it-t row" style="align-items:flex-start;gap:12px">${thumb(it, 44)}<div style="min-width:0;flex:1"><b>${esc(it.descricao)}</b><small>${esc(it.codigo)} · ${esc(it.categoria)}${it.localizacao ? " · " + esc(it.localizacao) : ""}${lotsOf(it).length > 1 ? " · " + lotsOf(it).length + " entradas" : ""}</small>
          <div class="mini-stack" aria-hidden="true"><div style="width:${Math.max(0, s.disp) / tot * 100}%;background:var(--s1)"></div><div style="width:${s.comp / tot * 100}%;background:var(--s2)"></div><div style="width:${s.res / tot * 100}%;background:var(--s3)"></div><div style="width:${s.ent / tot * 100}%;background:var(--s4)"></div></div></div></div>
        <div class="hide-md small"><span class="num">${fmtD(s.age)}</span><br><span class="${d > S.cfg.diasParado && s.disp > 0 ? "" : "muted"}" style="${d > S.cfg.diasParado && s.disp > 0 ? "color:var(--serious-ink);font-weight:600" : ""}">${d} dias</span></div>
        <div class="r-al num hide-sm">${fmtN(s.rec)}</div>
        <div class="r-al num hide-md">${fmtN(s.comp + s.res)}</div>
        <div class="r-al num" style="font-weight:700;${s.disp < 0 ? "color:var(--crit-ink)" : ""}">${fmtN(s.disp)}</div>
        <div class="r-al num hide-sm">${it.semValor ? '<span class="small" style="color:var(--warn-ink)">não informado</span>' : BRL.format(it.valorUnitario)}</div>
        <div class="r-al num" style="font-weight:600">${it.semValor ? '<span class="small" style="color:var(--warn-ink);font-weight:600">sem valor</span>' : BRL.format(Math.max(0, s.disp) * it.valorUnitario)}</div>
      </div>`; }).join("") || `<div class="empty"><b>${Object.keys(S.items).length ? "Nenhum item corresponde aos filtros" : "A reserva técnica está vazia"}</b>${Object.keys(S.items).length ? "Limpe a busca ou troque a situação." : "Importe a planilha de controle atual ou registre a primeira entrada."}${!Object.keys(S.items).length && can.editItems() ? `<br><button class="btn primary" data-act="import">Importar planilha atual</button> <button class="btn" data-act="new-entry">Registrar entrada</button>` : ""}</div>`}
  </div></div>
  <div class="legend"><span><i style="background:var(--s1)"></i>Disponível</span><span><i style="background:var(--s2)"></i>Comprometido em trâmite</span><span><i style="background:var(--s3)"></i>Reservado (autorizado)</span><span><i style="background:var(--s4)"></i>Entregue</span></div>`;
}

function thumb(it, size) {
  if (it.foto) return `<img src="${esc(it.foto)}" alt="" style="width:${size}px;height:${size}px;object-fit:cover;border-radius:8px;flex:none;background:var(--panel-2);border:1px solid var(--line-2)">`;
  return `<span aria-hidden="true" style="width:${size}px;height:${size}px;border-radius:8px;flex:none;display:grid;place-items:center;background:var(--panel-2);color:var(--muted);border:1px solid var(--line-2)">${ic("box").replace("<svg", `<svg style="width:${Math.round(size / 2.4)}px;height:${Math.round(size / 2.4)}px"`)}</span>`;
}
function openItem(id) {
  const it = S.items[id]; if (!it) return;
  const s = computeStock()[id]; const tot = Math.max(1, s.rec);
  const plans = Object.values(S.plans).filter(p => (p.itens || []).some(li => li.itemId === id)).sort((a, b) => b.criadoEm - a.criadoEm);
  const parts = [["Disponível", Math.max(0, s.disp), "--s1"], ["Comprometido", s.comp, "--s2"], ["Reservado", s.res, "--s3"], ["Entregue", s.ent, "--s4"]];
  const gar = it.garantiaAte ? Math.ceil((it.garantiaAte - now()) / DAY) : null;
  const ls = lotsOf(it).slice().sort((a, b) => (b.data || 0) - (a.data || 0));
  openModal({drawer:true, title:esc(it.descricao), sub:esc(it.codigo) + (it.especificacao ? " · " + esc(it.especificacao) : ""), body:`
    ${it.foto ? `<img src="${esc(it.foto)}" alt="Foto ilustrativa de ${esc(it.descricao)}" style="width:100%;max-height:220px;object-fit:contain;border-radius:12px;background:var(--panel-2);margin-bottom:12px">` : ""}
    <div class="row wrap" style="gap:6px;margin-bottom:14px"><span class="pill">${esc(it.categoria)}</span>${it.localizacao ? `<span class="pill">${esc(it.localizacao)}</span>` : ""}<span class="pill">${esc(it.unidadeMedida || "unidade")}</span>${gar !== null ? `<span class="pill" style="${gar < 0 ? "color:var(--crit-ink);background:var(--crit-soft)" : gar < S.cfg.diasGarantia ? "color:var(--serious-ink);background:var(--serious-soft)" : ""}">${gar < 0 ? "Garantia vencida" : "Garantia até " + fmtD(it.garantiaAte)}</span>` : ""}${it.semValor ? '<span class="pill" style="color:var(--warn-ink);background:var(--warn-soft)">Sem valor unitário</span>' : ""}</div>
    <div class="kpis" style="grid-template-columns:repeat(3,1fr);margin-bottom:12px">
      <div class="card kpi"><div class="l">Disponível</div><div class="v num">${fmtN(s.disp)}</div><div class="d">${it.semValor ? "valor não informado" : BRLc(Math.max(0, s.disp) * it.valorUnitario)}</div></div>
      <div class="card kpi"><div class="l">Sob guarda</div><div class="v num">${fmtN(s.saldo)}</div><div class="d">de ${fmtN(s.rec)} recebidos</div></div>
      <div class="card kpi"><div class="l">Saldo mais antigo</div><div class="v num">${daysSince(s.age)}</div><div class="d">dias em estoque</div></div>
    </div>
    <div class="stack">${parts.map(([l, v, c]) => v ? `<div style="width:${v / tot * 100}%;background:var(${c})" data-tip="${l}: ${fmtN(v)} un."></div>` : "").join("")}</div>
    <div class="legend">${parts.map(([l, v, c]) => `<span><i style="background:var(${c})"></i>${l} <b class="num">${fmtN(v)}</b></span>`).join("")}</div>
    <hr><div class="row"><h3>Entradas (${ls.length})</h3><span class="sp"></span>${can.editItems() ? `<button class="btn sm" data-act="new-entry" data-id="${id}">${ic("plus")}Nova entrada</button>` : ""}</div>
    <div class="tbl-wrap" style="margin-top:8px"><table class="tbl"><thead><tr><th>Data</th><th class="r-al">Qtd.</th><th class="r-al">Valor unit.</th><th>Empenho / requisição</th><th>Processo</th></tr></thead><tbody>
      ${ls.map(l => `<tr><td class="num">${fmtD(l.data)}</td><td class="r-al num">${fmtN(l.qtd)}</td><td class="r-al num">${+l.vu > 0 ? BRL.format(l.vu) : '<span class="muted">—</span>'}</td><td class="small">${esc([l.empenho && "NE " + l.empenho, l.requisicao && "Req. " + l.requisicao, l.pregao && "Pregão " + l.pregao].filter(Boolean).join(" · ") || "—")}</td><td class="small">${esc(l.processo || "—")}${l.obs ? `<div class="muted">${esc(l.obs)}</div>` : ""}</td></tr>`).join("")}
    </tbody></table></div>
    <hr>
    <table class="tbl"><tbody>
      ${[["Valor unitário médio", it.semValor ? "Não informado" : BRL.format(it.valorUnitario) + (it.valorParcial ? " (há entradas sem valor)" : "")], ["Marca / modelo", [it.marca, it.modelo].filter(Boolean).join(" / ") || "—"], ["Fornecedor", it.fornecedor], ["Exige tombamento", it.exigeTombamento ? "Sim" : "Não"], ["Observações", it.obs || "—"]].map(([a, b]) => `<tr><td class="muted" style="width:42%">${a}</td><td>${esc(b || "—")}</td></tr>`).join("")}
    </tbody></table>
    ${(() => { const bs = Object.values(S.bens || {}).filter(b => b.materialId === id); if (!bs.length) return ""; const res = bs.filter(b => b.situacao === "EM_RESERVA").sort((x, y) => x.numero.localeCompare(y.numero, "pt-BR", {numeric:true})); const porEmp = {}; res.forEach(b => (porEmp[b.empenhoId] = porEmp[b.empenhoId] || []).push(b.numero));
      return `<hr><div class="row"><h3>Tombamentos na reserva</h3><span class="sp"></span><span class="small muted">${fmtN(res.length)} na reserva · ${fmtN(bs.length - res.length)} entregues</span></div>
      ${res.length ? `<div class="small" style="margin-top:8px">${Object.entries(porEmp).map(([eid, ns]) => { const e = S.empenhos[eid]; return `<div style="padding:6px 0;border-bottom:1px solid var(--line-2)"><a href="#" data-act="emp-abrir" data-id="${eid}"><b>${esc(e ? e.numero : "Empenho")}</b>${e && e.nf ? " · NF " + esc(e.nf) : ""}</a> <span class="muted">(${fmtN(ns.length)})</span><div class="num">${esc(faixas(ns))}</div></div>`; }).join("")}</div>` : '<p class="small muted" style="margin-top:6px">Todos os bens tombados deste material já foram entregues.</p>'}`; })()}

async function saveFile(filename, data) {

  try {

    const url = URL.createObjectURL(data instanceof Blob ? data : new Blob([data], {type}));
    const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  } catch (e) { toast("Não foi possível baixar o arquivo.", true); }
}

  return `<div class="kanban">${cols.map(([t, ss]) => { const ps = plans.filter(p => ss.includes(p.status)); return `<div class="col"><h3>${t}<span class="badge">${ps.length}</span></h3>${ps.map(p => `<div class="kc" data-act="plan" data-id="${p.id}"><div class="row"><b class="num">${esc(p.numero)}</b><span class="sp"></span>${p.legado ? '<span class="pill">Histórico</span>' : stPill(p.status)}</div><div class="m"><b style="font-weight:600">${esc(p.finalidade)}</b><br>${esc(p.unidade)}</div><div class="f"><span>${plural(planQtd(p), "bem", "bens")}</span><span class="num" style="font-weight:700;color:var(--ink)">${BRLc(planTotal(p))}</span></div>${isLate(p) ? `<div class="small" style="color:var(--warn-ink);font-weight:600;margin-top:6px">${ic("clock", "").replace("<svg", '<svg style="width:12px;height:12px;vertical-align:-1px"')} ${daysSince(stageEnteredAt(p))} dias na etapa</div>` : ""}</div>`).join("") || '<p class="small muted">Nenhum plano.</p>'}</div>`; }).join("")}</div>`;
}

function formPlano(id, preItem, draft) {
  const p0 = id ? clone(S.plans[id]) : {unidade:draft ? draft.unidade : "", finalidade:draft ? draft.finalidade : "", justificativa:draft ? draft.justificativa : "", demanda:"", itens:[]};
  const st = computeStock();
  let sel = p0.itens.map(li => ({...li}));
  if (preItem && !sel.some(x => x.itemId === preItem)) { const it = S.items[preItem]; sel.push({itemId:it.id, codigo:it.codigo, descricao:it.descricao, qtd:1, vu:it.valorUnitario}); }
  const dispOf = iid => { const s = st[iid]; if (!s) return 0; const own = id ? (S.plans[id].itens.find(x => x.itemId === iid) || {}).qtd || 0 : 0; return s.disp + (S.plans[id] && COMPROMETE.concat(RESERVA).includes(S.plans[id].status) ? own : 0); };
  if (draft) draft.itens.forEach(x => { const it = S.items[x.material_id]; if (!it || sel.some(y => y.itemId === it.id)) return; const d = dispOf(it.id); if (d <= 0) return; sel.push({itemId:it.id, codigo:it.codigo, descricao:it.descricao, qtd:Math.min(d, x.quantidade), vu:it.valorUnitario}); });

    <form id="f-plan" class="form-grid" autocomplete="off">
      <div class="field full"><label>Unidade de destino <span class="muted">(hierarquia SIPAC)</span></label><div id="upk-plan"></div></div>
      <div class="field"><label>Finalidade (título curto)</label><input class="inp" name="finalidade" required maxlength="70" value="${esc(p0.finalidade)}" placeholder="Ex.: Laboratório de práticas contábeis"></div>
      <div class="field"><label>Documento de demanda da unidade <span class="muted">(opcional)</span></label><input class="inp" name="demanda" value="${esc(p0.demanda)}" placeholder="Memorando eletrônico nº 000/2026"></div>
      <div class="field full"><label>Justificativa da destinação</label><textarea class="inp" name="justificativa" required placeholder="Explique a necessidade da unidade e o uso previsto dos bens.">${esc(p0.justificativa)}</textarea></div>
    </form>
    <hr>
    <div class="row wrap"><h3>Bens do plano</h3><span class="sp"></span><input class="inp" id="pick-q" type="search" placeholder="Buscar bem na reserva…" style="max-width:340px"></div>
    <div class="pick-list" id="pick-list" style="margin-top:10px"></div>
    <div id="sel" style="margin-top:14px"></div>
    <div id="alc" style="margin-top:12px"></div>`, foot:`<button class="btn" data-act="close">Cancelar</button><button class="btn" id="pl-save">Salvar rascunho</button><button class="btn primary" id="pl-send">Salvar e enviar para instrução</button>`});
  let unidadeSel = {code:p0.unidadeCode || (draft && draft.unidadeCode) || "", name:p0.unidade || ""};
  if (draft && draft.unidade && !unidadeSel.code) { const mu = matchUnit(draft.unidade) || searchUnits(draft.unidade, 1)[0]; if (mu) unidadeSel = {code:mu.code, name:mu.name}; }
  mountUnitPicker($("#upk-plan", m), unidadeSel, v => { unidadeSel = v; });
  const drawPick = () => {
    const q = $("#pick-q").value.trim().toLowerCase();
    const list = Object.values(S.items).filter(it => dispOf(it.id) > 0 && !sel.some(x => x.itemId === it.id) && (!q || (it.descricao + " " + it.codigo + " " + it.categoria).toLowerCase().includes(q))).sort((a, b) => dispOf(b.id) - dispOf(a.id)).slice(0, 40);
    $("#pick-list").innerHTML = list.map(it => `<div class="opt" data-pick="${it.id}">${thumb(it, 36)}<div style="flex:1;min-width:0"><b style="font-size:13.5px">${esc(it.descricao)}</b><div class="small muted">${esc(it.codigo)} · ${esc(it.categoria)} · ${it.semValor ? "sem valor informado" : BRL.format(it.valorUnitario)}</div></div><span class="pill num">${fmtN(dispOf(it.id))} disp.</span>${ic("plus")}</div>`).join("") || '<p class="small muted" style="padding:12px">Nenhum bem com saldo disponível corresponde à busca.</p>';
  };
  const drawSel = () => {
    const tot = sel.reduce((a, x) => a + x.qtd * x.vu, 0);
    $("#sel").innerHTML = sel.length ? `<div class="pick-row small muted" style="font-weight:700;border-bottom:1px solid var(--line)"><span>Bem selecionado</span><span class="r-al">Quantidade</span><span class="r-al hide-sm">Subtotal</span><span></span></div>` + sel.map((x, i) => { const d = dispOf(x.itemId); const over = x.qtd > d; return `<div class="pick-row"><div style="min-width:0"><b style="font-size:13.5px">${esc(x.descricao)}</b><div class="small ${over ? "" : "muted"}" style="${over ? "color:var(--crit-ink);font-weight:600" : ""}">${over ? "Acima do disponível: " : "Disponível: "}${fmtN(d)} · ${BRL.format(x.vu)} cada</div></div><div class="qty-ctrl" style="justify-content:flex-end"><input class="inp num" type="number" min="1" max="${d}" value="${x.qtd}" data-q="${i}" aria-label="Quantidade"></div><div class="r-al num hide-sm" style="font-weight:600">${BRL.format(x.qtd * x.vu)}</div><button class="btn ghost icon-btn" data-rm="${i}" aria-label="Remover">${ic("x")}</button></div>`; }).join("") + `<div class="row" style="justify-content:flex-end;padding-top:10px"><span class="ink2">Total do plano</span><b class="num" style="font-size:18px">${BRL.format(tot)}</b></div>` : '<p class="muted small">Nenhum bem selecionado ainda. Busque acima e toque para adicionar.</p>';
    const req = requiredSigners(tot);
    $("#alc").innerHTML = sel.length ? `<div class="alert ${req.length > 1 ? "warning" : "good"}"><div class="ic">${ic("shield")}</div><div><b>Alçada de autorização: ${req.map(r => esc(S.cfg.signatarios[r].cargo)).join(" e ")}</b><p>${S.cfg.exigirAmbos ? "A configuração exige as duas assinaturas em todos os planos." : `Planos até ${BRL.format(S.cfg.limiteAlcada)} são autorizados pela PRA; acima disso, também pela Reitoria${S.cfg.sequencial ? ", nesta ordem" : ""}.`}</p></div></div>` : "";
  };
  m.addEventListener("click", e => {
    const pk = e.target.closest("[data-pick]"); if (pk) { const it = S.items[pk.dataset.pick]; sel.push({itemId:it.id, codigo:it.codigo, descricao:it.descricao, qtd:1, vu:it.valorUnitario}); drawPick(); drawSel(); setTimeout(() => { const inp = $$("[data-q]", m).pop(); inp && inp.select(); }, 0); }
    const rm = e.target.closest("[data-rm]"); if (rm) { sel.splice(+rm.dataset.rm, 1); drawPick(); drawSel(); }
  });
  m.addEventListener("change", e => { if (e.target.dataset.q != null) { sel[+e.target.dataset.q].qtd = Math.max(1, parseInt(e.target.value, 10) || 1); drawSel(); } });
  $("#pick-q").oninput = drawPick;
  drawPick(); drawSel();
  const save = async send => {
    const f = $("#f-plan"); if (!unidadeSel.name) { toast("Escolha a unidade de destino.", true); $("#upk-plan input") && $("#upk-plan input").focus(); return; }
    if (!f.reportValidity()) return;
    if (!sel.length) { toast("Adicione pelo menos um bem ao plano.", true); return; }
    const over = sel.find(x => x.qtd > dispOf(x.itemId)); if (over) { toast("A quantidade de “" + over.descricao + "” passa do disponível.", true); return; }
    const fd = Object.fromEntries(new FormData(f));
    if (S.mode === "oficial") {
      const orgU = unidadeSel.code ? orgaoOf(unidadeSel.code) : null;
      const pid = await sbDo("salvar_plano", {p_papel:R(), p_id:id || null, p_dados:{unidade:unidadeSel.name.trim(), unidadeCode:unidadeSel.code || "", orgaoCode:orgU ? orgU.code : "", finalidade:fd.finalidade.trim(), justificativa:fd.justificativa.trim(), demanda:fd.demanda.trim(), origemAssistente:!!draft, itens:sel.map(x => ({itemId:x.itemId, qtd:x.qtd}))}, p_enviar:!!send}, null);
      if (pid) { if (draft && draft.detId && typeof pid === "string") { try { await SB.rpc("atender_determinacao", {p_papel:R(), p_id:draft.detId, p_plano:pid}); await sbLoad(true); } catch (e) { toast("Plano salvo, mas a determinação não foi baixada: " + e.message, true); } } closeModal(); toast(send ? "Plano enviado para instrução." : "Rascunho salvo."); location.hash = "plano-" + (typeof pid === "string" ? pid : id); }
      return;
    }
    let p;
    if (id) { p = clone(S.plans[id]); }
    else {
      const yr = new Date().getFullYear();
      const nums = Object.values(S.plans).map(x => (x.numero || "").match(/(\d+)\/(\d{4})/)).filter(x => x && +x[2] === yr).map(x => +x[1]);
      p = {id:"pl" + rid(10), numero:"PD " + String((nums.length ? Math.max(...nums) : 0) + 1).padStart(4, "0") + "/" + yr, criadoEm:now(), criadoPor:S.me.id, eventos:[], etapas:[], assinaturas:{}, conferencia:{}, entrega:null};
      setStatus(p, "RASCUNHO"); await addEvent(p, "criacao", draft ? "Plano de destinação criado a partir de sugestão do assistente" : "Plano de destinação criado");
    }
    const orgU = unidadeSel.code ? orgaoOf(unidadeSel.code) : null;
    Object.assign(p, {unidade:unidadeSel.name.trim(), unidadeCode:unidadeSel.code || "", orgaoCode:orgU ? orgU.code : "", finalidade:fd.finalidade.trim(), justificativa:fd.justificativa.trim(), demanda:fd.demanda.trim(), itens:sel.map(x => ({itemId:x.itemId, codigo:x.codigo, descricao:x.descricao, qtd:x.qtd, vu:x.vu}))});
    if (id) await addEvent(p, "edicao", "Plano editado · " + plural(planQtd(p), "bem", "bens") + " · " + BRL.format(planTotal(p)));
    if (send) { setStatus(p, "INSTRUCAO"); await addEvent(p, "envio", "Enviado para instrução documental"); }
    if (draft && draft.detId && !id) { await addEvent(p, "determinacao", "Plano montado a partir da determinação " + ((S.determ[draft.detId] || {}).numero || "")); }
    if (await persist("planos", p.id, p)) { if (draft && draft.detId && !id) { try { DET_LOCAL.atender({p_id:draft.detId, p_plano:p.id}); saveDemo(); } catch (e) {} } closeModal(); toast(send ? p.numero + " enviado para instrução." : "Rascunho " + p.numero + " salvo."); location.hash = "plano-" + p.id; renderShell(); render(); }
  };
  $("#pl-save").onclick = () => save(false);
  $("#pl-send").onclick = () => save(true);
}

// ---------- detalhe do plano ----------
function vPlano() {
  const p = S.plans[S.param];
  if (!p) return `<div class="empty card"><b>Plano não encontrado</b>Ele pode ter sido removido ou o link está incompleto.<br><a class="btn" href="#planos">Voltar aos planos</a></div>`;
  const total = planTotal(p); const st = computeStock();
  const stopped = ["INDEFERIDO","CANCELADO"].includes(p.status);
  const curIdx = STAGES.indexOf(p.status);
  const reachedIdx = stopped ? STAGES.indexOf((p.etapas || []).filter(e => STAGES.includes(e.s)).slice(-1)[0]?.s || "RASCUNHO") : curIdx;
  const mrail = STAGES.map((s, i) => { const e = (p.etapas || []).filter(x => x.s === s).slice(-1)[0];
    const cls = stopped && i === reachedIdx + 1 ? "stop" : i < curIdx || (p.status === "ENTREGUE" && i === curIdx) || (stopped && i <= reachedIdx) ? "done" : i === curIdx ? "cur" : "";
    return `<div class="s ${cls}"><div class="d">${cls === "done" ? ic("check") : cls === "stop" ? ic("x") : ""}</div>${ST[s].short || ST[s].l}${e ? `<small>${fmtD(e.at)}</small>` : ""}</div>`; }).join("");
  const actions = p.legado ? "" : planActions(p);
  const req = p.assinaturasExigidas || requiredSigners(total);
  const sigBlocks = req.map(r => { const a = (p.assinaturas || {})[r]; const nx = nextSigner(p);
    return `<div class="alert ${a ? "good" : ""}" style="${a ? "" : "background:var(--panel)"}"><div class="ic" style="${a ? "" : "background:var(--panel-2);color:var(--muted)"}">${ic(a ? "check" : "autorizacoes")}</div><div style="min-width:0"><b>${esc(S.cfg.signatarios[r].cargo)}</b>${a ? `<p>Assinado por ${esc(nameOf(a.by))} em ${fmtDT(a.at)}</p><p class="small muted">Código ${vcode(a.sig)}</p>` : `<p>${p.status === "AUTORIZACAO" ? (nx && nx.includes(r) ? "Aguardando assinatura" : "Aguarda a assinatura anterior") : p.status === "INDEFERIDO" ? "Não assinado" : "Assinatura prevista após a instrução"}</p>`}</div></div>`; }).join("");
  return `
  <div class="row" style="margin-bottom:10px"><a class="btn ghost sm" href="#planos">${ic("back")}Planos</a></div>
  <div class="page-h"><div><div class="row wrap" style="gap:10px"><h1 class="num">${esc(p.numero)}</h1>${stPill(p.status)}${isLate(p) ? `<span class="pill" style="color:var(--warn-ink);background:var(--warn-soft)">${ic("clock").replace("<svg", '<svg style="width:12px;height:12px"')}${daysSince(stageEnteredAt(p))} dias na etapa · prazo ${S.cfg.sla[p.status]}</span>` : ""}</div>
    <p style="margin-top:6px"><b>${esc(p.finalidade)}</b> · ${esc(p.unidade)}</p>${p.unidadeCode && ORG.by.get(p.unidadeCode) ? `<p class="small muted">${esc(uPathText(p.unidadeCode) || S.cfg.sigla)} · código SIPAC ${esc(p.unidadeCode)}</p>` : ""}</div>
    <div class="r">${actions}</div></div>
  <div class="card" style="padding:16px 18px;margin-bottom:16px"><div class="mrail">${mrail}</div>
    ${p.status === "INDEFERIDO" && p.indeferimento ? `<div class="alert critical" style="margin-top:10px"><div class="ic">${ic("x")}</div><div><b>Indeferido por ${esc(S.cfg.signatarios[p.indeferimento.role]?.cargo || ROLES[p.indeferimento.role].label)} em ${fmtD(p.indeferimento.at)}</b><p>${esc(p.indeferimento.motivo)}</p></div></div>` : ""}
    ${p.legado ? `<div class="alert" style="margin-top:10px"><div class="ic" style="background:var(--panel);color:var(--ink-2)">${ic("planos")}</div><div><b>Registro histórico</b><p>Saída feita antes da implantação do Destina e importada da planilha de controle. Não passou pelo fluxo de autorização e assinatura do sistema.</p></div></div>` : ""}
    ${p.devolucao && p.status === "RASCUNHO" ? `<div class="alert warning" style="margin-top:10px"><div class="ic">${ic("ret")}</div><div><b>Devolvido para ajustes</b><p>${esc(p.devolucao)}</p></div></div>` : ""}
  </div>
  <div class="grid g-12">
    <div class="c-8" style="display:flex;flex-direction:column;gap:16px">
      <section class="card"><div class="card-h"><h3>Bens destinados</h3><span class="sub">${plural(planQtd(p), "bem", "bens")}</span><div class="r"><b class="num" style="font-size:17px">${BRL.format(total)}</b></div></div>
        <div class="card-b tbl-wrap"><table class="tbl"><thead><tr><th>Bem</th><th class="r-al">Qtd.</th><th class="r-al">Valor unit.</th><th class="r-al">Subtotal</th>${p.status === "ENTREGUE" ? "<th>Tombamentos</th>" : ""}</tr></thead><tbody>
        ${p.itens.map(li => { const it = S.items[li.itemId]; const tb = p.entrega && p.entrega.tombamentos ? p.entrega.tombamentos[li.itemId] : null;
          return `<tr><td><a href="#" data-act="item" data-id="${li.itemId}" style="font-weight:600;color:var(--ink);text-decoration:none">${esc(li.descricao)}</a><div class="small muted">${esc(li.codigo)}${it ? " · " + esc(it.localizacao) : ""}${p.status === "RASCUNHO" && st[li.itemId] && st[li.itemId].disp < li.qtd ? ' · <span style="color:var(--crit-ink);font-weight:600">saldo atual ' + fmtN(st[li.itemId].disp) + "</span>" : ""}</div></td><td class="r-al num">${fmtN(li.qtd)}</td><td class="r-al num">${BRL.format(li.vu)}</td><td class="r-al num" style="font-weight:600">${BRL.format(li.qtd * li.vu)}</td>${p.status === "ENTREGUE" ? `<td class="small">${tb && tb.length ? esc(tb.length > 3 ? tb[0] + " a " + tb[tb.length - 1] + " (" + tb.length + ")" : tb.join(", ")) : "—"}</td>` : ""}</tr>`; }).join("")}
        </tbody></table></div></section>
      <section class="card"><div class="card-h"><h3>Instrução</h3></div><div class="card-b"><table class="tbl"><tbody>
        ${[["Justificativa", p.justificativa], ["Demanda da unidade", p.demanda || "—"], ["Processo SIPAC", p.processo || "A definir na formalização"], ["Fundamentação", p.fundamentacao || "A definir na formalização"], ["Despacho", p.despacho || "—"], ["Criado por", nameOf(p.criadoPor) + " em " + fmtDT(p.criadoEm)]].map(([a, b]) => `<tr><td class="muted" style="width:28%">${a}</td><td>${esc(b)}</td></tr>`).join("")}
        ${p.entrega ? `<tr><td class="muted">Entrega</td><td>${fmtDT(p.entrega.data)} · recebido por <b>${esc(p.entrega.recebedor)}</b> (SIAPE ${esc(p.entrega.siape)}), ${esc(p.entrega.cargo)} · ${esc(p.entrega.local)}</td></tr>` : ""}
      </tbody></table></div></section>
    </div>
    <div class="c-4" style="display:flex;flex-direction:column;gap:16px">
      ${p.legado ? "" : `<section class="card"><div class="card-h"><h3>Assinaturas</h3><span class="sub">alçada ${req.length > 1 ? "dupla" : "simples"}</span></div><div class="card-b" style="padding-top:10px">${sigBlocks}</div></section>`}
      <section class="card"><div class="card-h"><h3>Documentos</h3></div><div class="card-b" style="padding-top:10px;display:flex;flex-direction:column;gap:8px">
        ${p.legado ? '<p class="small muted">Registros históricos não geram termos no Destina.</p>' : p.processo ? `<button class="btn" data-act="doc" data-doc="aut" data-id="${p.id}" style="justify-content:flex-start">${ic("planos")}Termo de autorização de destinação</button>` : '<p class="small muted">O termo de autorização é gerado na formalização.</p>'}
        ${p.status === "ENTREGUE" && !p.legado ? `<button class="btn" data-act="doc" data-doc="ent" data-id="${p.id}" style="justify-content:flex-start">${ic("entregas")}Guia de entrega e termo de responsabilidade</button>` : ""}
      </div></section>
      <section class="card"><div class="card-h"><h3>Trilha de auditoria</h3><div class="r"><button class="btn sm ghost" data-act="verify-chain" data-id="${p.id}">Verificar integridade</button></div></div>
        <div class="card-b"><div class="tl">${(p.eventos || []).slice().reverse().map(ev => `<div class="ev ${ev.tipo === "assinatura" || ev.tipo === "entrega" ? "sig" : ev.tipo === "indeferimento" || ev.tipo === "cancelamento" ? "bad" : ""}"><b>${esc(ev.msg)}</b><div class="m">${esc(nameOf(ev.by))} · ${esc(ROLES[ev.role] ? ROLES[ev.role].label : ev.role)} · ${fmtDT(ev.at)}</div><div class="h">hash ${ev.h.slice(0, 16)}…</div></div>`).join("")}</div></div></section>
    </div>
  </div>`;
}
function planActions(p) {
  const b = [];
  if (p.status === "RASCUNHO" && can.createPlan()) { b.push(`<button class="btn danger" data-act="cancel-plan" data-id="${p.id}">Cancelar plano</button>`, `<button class="btn" data-act="edit-plan" data-id="${p.id}">Editar</button>`, `<button class="btn primary" data-act="send-plan" data-id="${p.id}">Enviar para instrução</button>`); }
  if (p.status === "INSTRUCAO" && can.formalize()) { b.push(`<button class="btn" data-act="return-plan" data-id="${p.id}">${ic("ret")}Devolver para ajustes</button>`, `<button class="btn primary" data-act="formalize" data-id="${p.id}">Formalizar e submeter</button>`); }
  if (p.status === "AUTORIZACAO" && can.sign(p)) { b.push(`<button class="btn danger" data-act="deny" data-id="${p.id}">Indeferir</button>`, `<button class="btn primary" data-act="sign" data-id="${p.id}">${ic("autorizacoes")}Revisar e assinar</button>`); }
  if (p.status === "AUTORIZADO" && can.separate()) b.push(`<button class="btn primary" data-act="start-sep" data-id="${p.id}">Iniciar separação</button>`);
  if (p.status === "SEPARACAO" && can.separate()) b.push(`<button class="btn primary" data-act="conferir" data-id="${p.id}">Conferir itens separados</button>`);
  if (p.status === "PRONTO" && can.deliver()) b.push(`<button class="btn accent" data-act="deliver" data-id="${p.id}">${ic("entregas")}Registrar entrega</button>`);
  if (can.admin() && !["ENTREGUE","INDEFERIDO","CANCELADO","RASCUNHO"].includes(p.status)) b.unshift(`<button class="btn ghost danger" data-act="cancel-plan" data-id="${p.id}">Cancelar</button>`);
  return b.join("");

function confirmarIdentidade(role, alvo) {
  return new Promise(resolve => {
    let fim = false; const done = v => { if (fim) return; fim = true; resolve(v); };
    const passo1 = () => {
      const m = openModal({title:"Confirme a sua identidade", sub:"Assinatura de " + esc(alvo), body:`
        <p class="ink2" style="margin-top:0">Para assinar como <b>${esc(S.cfg.signatarios[role] ? S.cfg.signatarios[role].cargo : role)}</b>, digite novamente a sua senha do Destina.</p>
        <div class="field"><label>Senha</label><input class="inp" id="ci-s" type="password" autocomplete="current-password" required></div>
        <p class="small" id="ci-m" style="min-height:18px"></p>`,
        foot:`<button class="btn" data-act="close">Cancelar</button><button class="btn primary" id="ci-go">Continuar</button>`});
      const go = async () => {
        const senha = $("#ci-s", m).value; const msg = $("#ci-m", m); if (!senha) return;
        $("#ci-go", m).disabled = true; msg.style.color = ""; msg.textContent = "Conferindo…";
        try { await SB.signIn(S.me.email, senha); } catch (e) { msg.style.color = "var(--crit-ink)"; msg.textContent = e.message; $("#ci-go", m).disabled = false; return; }
        try { const r = await SB.rpc("pedir_codigo_assinatura", {p_papel:role}); if (r && r.exige_codigo) passo2(r.enviado_para); else { fim = true; closeModal(); resolve(true); } }
        catch (e) { msg.style.color = "var(--crit-ink)"; msg.textContent = e.message; $("#ci-go", m).disabled = false; }
      };
      $("#ci-go", m).onclick = go; $("#ci-s", m).onkeydown = e => { if (e.key === "Enter") go(); };
      setTimeout(() => $("#ci-s", m) && $("#ci-s", m).focus(), 60);
      vigiarFechamento(m);
    };
    const passo2 = para => {
      const m = openModal({title:"Digite o código enviado ao seu e-mail", sub:"Assinatura de " + esc(alvo), body:`
        <p class="ink2" style="margin-top:0">Enviamos um código de 6 dígitos para <b>${esc(para || "o seu e-mail")}</b>. Ele vale por 10 minutos.</p>
        <div class="field"><label>Código</label><input class="inp num" id="ci-c" inputmode="numeric" autocomplete="one-time-code" maxlength="7" style="font-size:22px;letter-spacing:6px;max-width:200px"></div>
        <p class="small" id="ci-m" style="min-height:18px"></p>`,
        foot:`<button class="btn ghost" id="ci-re">Reenviar código</button><span class="sp"></span><button class="btn" data-act="close">Cancelar</button><button class="btn primary" id="ci-go">Confirmar e assinar</button>`});
      const go = async () => {
        const cod = $("#ci-c", m).value.replace(/\D/g, ""); const msg = $("#ci-m", m); if (cod.length !== 6) { msg.style.color = "var(--crit-ink)"; msg.textContent = "O código tem 6 dígitos."; return; }
        $("#ci-go", m).disabled = true; msg.style.color = ""; msg.textContent = "Conferindo…";
        try { const r = await SB.rpc("conferir_codigo_assinatura", {p_papel:role, p_codigo:cod}); if (r && r.ok) { fim = true; closeModal(); resolve(true); return; } msg.style.color = "var(--crit-ink)"; msg.textContent = (r && r.motivo) || "Código incorreto."; }
        catch (e) { msg.style.color = "var(--crit-ink)"; msg.textContent = e.message; }
        $("#ci-go", m).disabled = false;
      };
      $("#ci-go", m).onclick = go; $("#ci-c", m).onkeydown = e => { if (e.key === "Enter") go(); };
      $("#ci-re", m).onclick = async () => { try { const r = await SB.rpc("pedir_codigo_assinatura", {p_papel:role}); toast("Novo código enviado para " + (r.enviado_para || "o seu e-mail") + "."); } catch (e) { toast(e.message, true); } };
      setTimeout(() => $("#ci-c", m) && $("#ci-c", m).focus(), 60);
      vigiarFechamento(m);
    };
    // se o modal for fechado (Cancelar, Esc, clique fora) sem concluir, devolve "não"
    const vigiarFechamento = m => { const ob = new MutationObserver(() => { if (!document.body.contains(m)) { ob.disconnect(); setTimeout(() => { if (!fim && !$(".modal")) done(false); }, 0); } }); ob.observe(document.body, {childList:true, subtree:true}); };
    passo1();
  });
}

  m.addEventListener("input", e => { if (e.target.dataset.t) { tomb[e.target.dataset.t][+e.target.dataset.i] = e.target.value; clearTimeout(m._t); m._t = setTimeout(() => { const pos = e.target.dataset.t + "_" + e.target.dataset.i; drawT(); const el = m.querySelector(`[data-t="${e.target.dataset.t}"][data-i="${e.target.dataset.i}"]`); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }, 500); } });
  if (needT) $("#seqgo", m).onclick = () => { const s0 = $("#seq0").value.trim(); if (!/^\d+$/.test(s0)) { toast("Digite um número inicial só com algarismos.", true); return; } let n = BigInt(s0); const w = s0.length; for (const li of p0.itens) { if (!tomb[li.itemId]) continue; tomb[li.itemId] = tomb[li.itemId].map(() => { const v = String(n).padStart(w, "0"); n++; return v; }); } drawT(); };
  if ($("#usar-res", m)) $("#usar-res", m).onclick = () => { let n = 0; for (const li of p0.itens) { if (!tomb[li.itemId]) continue; const bs = bensEmReserva(li.itemId).map(b => b.numero).filter(x => !used.has(x)); tomb[li.itemId] = tomb[li.itemId].map((v, k) => bs[k] || v); n += Math.min(bs.length, li.qtd); } drawT(); toast(plural(n, "número preenchido", "números preenchidos") + " com os tombamentos mais antigos da reserva. Confira as plaquetas na separação."); };
  drawT();
  $("#go", m).onclick = async () => {
    const rec = $("#rec").value.trim(), siape = $("#siape").value.trim();
    if (!rec || !siape) { toast("Informe o recebedor e o SIAPE.", true); return; }
    if (needT) {
