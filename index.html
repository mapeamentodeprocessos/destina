      if (all.some(v => !v)) { toast("Preencha todos os números de tombamento.", true); return; }
      if (new Set(all).size !== all.length || all.some(v => used.has(v))) { toast("Há tombamentos repetidos ou já usados. Corrija os campos em vermelho.", true); return; }
    }
    const dt = new Date($("#dt").value + "T" + new Date().toTimeString().slice(0, 8)).getTime() || now();
    if (S.mode === "oficial") {
      const ok = await sbDo("registrar_entrega", {p_papel:R(), p_id:id, p_dados:{data:new Date(dt).toISOString(), recebedor:rec, siape, cargo:$("#cargo").value.trim(), local:$("#local").value.trim(), tombamentos:Object.fromEntries(Object.entries(tomb).map(([k, a]) => [k, a.map(x => x.trim())]))}}, "Entrega registrada. Termo de responsabilidade gerado.");
      if (ok) { closeModal(); setTimeout(() => openDoc(id, "ent"), 250); }
      return;
    }
    const tbx = Object.fromEntries(Object.entries(tomb).map(([k, a]) => [k, a.map(x => x.trim())]));
    try { empBaixarLocal(id, tbx); } catch (err) { toast(err.message, true); return; }
    const p = clone(S.plans[id]);
    p.entrega = {data:dt, recebedor:rec, siape, cargo:$("#cargo").value.trim() || "Responsável pela unidade", local:$("#local").value.trim() || "Sede da unidade", tombamentos:Object.fromEntries(Object.entries(tomb).map(([k, a]) => [k, a.map(x => x.trim())])), registradoPor:S.me.id};
    setStatus(p, "ENTREGUE"); await addEvent(p, "entrega", "Entrega registrada · Recebedor " + rec + " · " + plural(planQtd(p), "bem", "bens") + (needT ? " tombados" : ""));
    if (await persist("planos", id, p)) { closeModal(); toast("Entrega registrada. Termo de responsabilidade gerado."); renderShell(); render(); setTimeout(() => openDoc(id, "ent"), 250); }
  };
}

// ---------- EMPENHOS E TOMBAMENTO ----------
// Fluxo: Almoxarifado recebe e registra o empenho (manual ou arquivo) → itens entram no saldo → processo vai à DIPA →
// DIPA gera os tombamentos → agenda e conclui o emplaquetamento. Na entrega, os números baixam os bens da reserva.
const EMP_ST = {
  RECEBIDO:{l:"Recebido no Almoxarifado", s:"Aguardando envio à DIPA", c:"info"},
  NA_DIPA:{l:"Aguardando tombamento", s:"Processo na DIPA", c:"warn"},
  TOMBADO:{l:"Tombado", s:"Aguardando emplaquetamento", c:"serious"},
  EMPLAQUETAMENTO_AGENDADO:{l:"Emplaquetamento agendado", s:"", c:"serious"},
  EMPLAQUETADO:{l:"Emplaquetado", s:"Concluído", c:"good"}
};
const empPill = st => { const x = EMP_ST[st] || {l:st, c:""}; const col = {info:"color:var(--brand-2);background:var(--brand-soft)", warn:"color:var(--warn-ink);background:var(--warn-soft)", serious:"color:var(--serious-ink);background:var(--serious-soft)", good:"color:var(--good-ink);background:var(--good-soft)"}[x.c] || ""; return `<span class="pill" style="${col}"><i></i>${esc(x.l)}</span>`; };
const empCanReceber = () => ["ALMOXARIFADO", "PATRIMONIO", "ADMIN"].includes(R());
const empCanTombar = () => ["PATRIMONIO", "ADMIN"].includes(R());
const empList = () => Object.values(S.empenhos || {});
const empBens = e => Object.values(S.bens || {}).filter(b => b.empenhoId === e.id);
const itemBens = it => Object.values(S.bens || {}).filter(b => b.itemId === it.id).sort((a, b) => a.numero.localeCompare(b.numero, "pt-BR", {numeric:true}));
const empQtd = e => (e.itens || []).reduce((a, i) => a + i.qtd, 0);
const empValor = e => (e.itens || []).reduce((a, i) => a + i.qtd * (i.vu || 0), 0);
const bensEmReserva = matId => Object.values(S.bens || {}).filter(b => b.materialId === matId && b.situacao === "EM_RESERVA").sort((a, b) => a.numero.localeCompare(b.numero, "pt-BR", {numeric:true}));
function faixas(nums) { // ["000150","000151","000152","900001"] → "000150 a 000152, 900001"
  const out = []; let ini = null, prev = null;
  const fecha = () => { if (ini !== null) out.push(ini === prev ? ini : ini + " a " + prev); };
  for (const n of nums) { if (prev !== null && /^\d+$/.test(n) && /^\d+$/.test(prev) && n.length === prev.length && BigInt(n) === BigInt(prev) + 1n) { prev = n; continue; } fecha(); ini = n; prev = n; }
  fecha(); return out.join(", ");
}
const proxNumero = (ini, k) => { if (!/^\d+$/.test(ini || "")) return ""; return (BigInt(ini) + BigInt(k)).toString().padStart(ini.length, "0"); };

// ---------- operações: oficial (banco) ou demonstração (local) ----------
const EMP_RPC = {registrar:"registrar_empenho", encaminhar:"encaminhar_empenho_dipa", tombar:"tombar_empenho", agendar:"agendar_emplaquetamento", concluir:"concluir_emplaquetamento", excluir:"excluir_empenho"};
async function empDo(op, args, okMsg) {
  if (S.mode === "oficial") return sbDo(EMP_RPC[op], {p_papel:R(), ...args}, okMsg);
  try { const r = EMP_LOCAL[op](args); saveDemo(); renderShell(); render(); if (okMsg) toast(okMsg); return r === undefined ? true : r; }
  catch (e) { toast(e.message, true); return false; }
}
const empHist = (e, t) => { e.historico = e.historico || []; e.historico.push({em:now(), por:S.me.id, papel:R(), texto:t}); };
const EMP_LOCAL = {
  registrar({p_dados:d}) {
    const num = String(d.numero || "").replace(/\s+/g, "").toUpperCase(), nf = String(d.nf || "").trim();
    if (!num) throw new Error("Informe o número do empenho.");
    if (!(d.itens || []).length) throw new Error("O empenho precisa ter pelo menos um item.");
    if (empList().some(e => e.numero === num && e.nf === nf)) throw new Error(`O empenho ${num} ${nf ? "com a NF " + nf : "(sem NF)"} já foi registrado.`);
    const e = {id:"em" + rid(10), numero:num, nf, nfData:d.nfData ? i2d(d.nfData) : null, dataEmpenho:d.dataEmpenho ? i2d(d.dataEmpenho) : null, fornecedor:(d.fornecedor || "").trim(), cnpj:(d.cnpj || "").trim(), processo:(d.processo || "").trim(), pregao:(d.pregao || "").trim(), requisicao:(d.requisicao || "").trim(), recebidoEm:d.recebidoEm ? i2d(d.recebidoEm) : now(), local:d.localRecebimento || "Almoxarifado Central", situacao:"RECEBIDO", obs:d.obs || "", arquivo:d.arquivo || "", historico:[], criadoPor:S.me.id, criadoEm:now(), itens:[]};
    d.itens.forEach((x, k) => {
      const desc = String(x.descricao || "").trim(), q = Math.round(+x.qtd || 0);
      if (!desc) throw new Error(`Item ${k + 1} sem descrição.`); if (q <= 0) throw new Error(`Item ${k + 1} ("${desc.slice(0, 40)}") sem quantidade.`);
      let it = x.materialId ? S.items[x.materialId] : Object.values(S.items).find(m => normName(m.descricao) === normName(desc));
      it = it ? clone(it) : {id:"it" + rid(10), codigo:"RT-" + new Date().getFullYear() + "-" + rid(4).toUpperCase(), descricao:desc, categoria:x.categoria || guessCat(desc), unidadeMedida:x.unidadeMedida || "UNIDADE", fornecedor:e.fornecedor, exigeTombamento:true, criadoEm:now(), lotes:[]};
      if (!it.lotes || !it.lotes.length) it.lotes = (S.items[it.id] ? lotsOf(it) : []).map(l => ({...l}));
      const lote = {id:"l" + rid(6), data:e.recebidoEm, qtd:q, vu:+(+x.vu || 0).toFixed(2), pregao:e.pregao, requisicao:e.requisicao, empenho:num, processo:e.processo, nf, obs:"", origem:"empenho"};
      it.lotes.push(lote); S.items[it.id] = syncItem(it);
      e.itens.push({id:"ei" + rid(8), seq:k + 1, descricao:desc, unidadeMedida:x.unidadeMedida || "UNIDADE", qtd:q, vu:+(+x.vu || 0), materialId:it.id, loteId:lote.id});
    });
    empHist(e, "Recebimento registrado · " + plural(e.itens.length, "item", "itens") + (e.arquivo ? " · importado de " + e.arquivo : ""));
    S.empenhos[e.id] = e; return e.id;
  },
  encaminhar({p_id}) { const e = S.empenhos[p_id]; if (!e || e.situacao !== "RECEBIDO") throw new Error("Este empenho não está aguardando encaminhamento."); e.situacao = "NA_DIPA"; e.encaminhadoEm = now(); empHist(e, "Processo de pagamento encaminhado à Divisão de Patrimônio"); },
  tombar({p_id, p_faixas}) {
    if (!empCanTombar()) throw new Error(`O perfil "${R()}" não pode executar esta ação.`);
    const e = S.empenhos[p_id]; if (!e) throw new Error("Empenho não encontrado.");
    if (!["RECEBIDO", "NA_DIPA", "TOMBADO"].includes(e.situacao)) throw new Error("Os tombamentos deste empenho já foram concluídos.");
    const usados = new Set([...Object.keys(S.bens), ...Object.values(S.plans).flatMap(p => p.entrega && p.entrega.tombamentos ? Object.values(p.entrega.tombamentos).flat() : [])]);
    let tot = 0; const novos = [];
    for (const i of e.itens) {
      const v = p_faixas[i.id]; if (v === undefined || v === null || v === "") continue;
      const falta = i.qtd - itemBens(i).length; if (falta <= 0) throw new Error(`O item ${i.seq} já está todo tombado.`);
      let nums;
      if (Array.isArray(v)) { nums = v.map(x => String(x).trim()).filter(Boolean); if (nums.length !== falta) throw new Error(`Item ${i.seq}: informe ${falta} número(s) de tombamento (recebidos: ${nums.length}).`); }
      else { const ini = String(v).replace(/\s/g, ""); if (!/^\d{1,15}$/.test(ini)) throw new Error(`Item ${i.seq}: o tombamento inicial deve ter só números.`); nums = Array.from({length:falta}, (_, k) => proxNumero(ini, k)); }
      if (new Set(nums).size !== nums.length) throw new Error(`Item ${i.seq}: há números repetidos na lista.`);
      const dup = nums.find(n => usados.has(n) || novos.some(b => b.numero === n)); if (dup) throw new Error(`O tombamento ${dup} já existe no sistema (item ${i.seq}).`);
      nums.forEach(n => novos.push({numero:n, itemId:i.id, empenhoId:e.id, materialId:i.materialId, situacao:"EM_RESERVA", planoId:null, geradoPor:S.me.id, geradoEm:now()}));
      tot += nums.length;
    }
    if (!tot) throw new Error("Informe o tombamento inicial de pelo menos um item.");
    novos.forEach(b => S.bens[b.numero] = b);
    const completo = e.itens.every(i => itemBens(i).length >= i.qtd);
    e.situacao = completo ? "TOMBADO" : "NA_DIPA"; e.encaminhadoEm = e.encaminhadoEm || now();
    empHist(e, plural(tot, "tombamento gerado", "tombamentos gerados") + (completo ? " · empenho todo tombado" : " · faltam itens")); return tot;
  },
  agendar({p_id, p_data, p_obs}) { const e = S.empenhos[p_id]; if (!p_data) throw new Error("Informe a data do emplaquetamento."); if (!e || !["TOMBADO", "EMPLAQUETAMENTO_AGENDADO"].includes(e.situacao)) throw new Error("Gere todos os tombamentos antes de agendar o emplaquetamento."); e.situacao = "EMPLAQUETAMENTO_AGENDADO"; e.emplData = i2d(p_data); empHist(e, "Emplaquetamento agendado para " + fmtD(e.emplData) + (p_obs ? " · " + p_obs : "")); },
  concluir({p_id, p_data}) { const e = S.empenhos[p_id]; if (!e || !["TOMBADO", "EMPLAQUETAMENTO_AGENDADO"].includes(e.situacao)) throw new Error("Gere todos os tombamentos antes de concluir o emplaquetamento."); e.situacao = "EMPLAQUETADO"; e.emplEm = p_data ? i2d(p_data) : now(); empHist(e, "Emplaquetamento concluído em " + fmtD(e.emplEm)); },
  excluir({p_id}) {
    const e = S.empenhos[p_id]; if (!e) return;
    if (empBens(e).some(b => b.situacao !== "EM_RESERVA")) throw new Error("Há bens deste empenho já entregues. Não é possível excluir.");
    const st = computeStock();
    for (const i of e.itens) if ((st[i.materialId] || {disp:0}).disp < i.qtd) throw new Error(`Parte de "${i.descricao}" já está em planos de destinação. Ajuste os planos antes de excluir.`);
    for (const i of e.itens) { const it = clone(S.items[i.materialId]); if (it) { it.lotes = lotsOf(it).filter(l => l.id !== i.loteId); S.items[it.id] = syncItem(it); } }
    empBens(e).forEach(b => delete S.bens[b.numero]); delete S.empenhos[p_id];
  }
};
// baixa local dos bens na entrega (demonstração); no oficial, o banco faz isso
function empBaixarLocal(planoId, tombs) {
  for (const [matId, arr] of Object.entries(tombs || {})) for (const n of arr) {
    const b = S.bens[n]; if (!b) continue;
    if (b.materialId !== matId) throw new Error(`O tombamento ${n} pertence a outro material da reserva.`);
    if (b.situacao !== "EM_RESERVA") throw new Error(`O tombamento ${n} já foi entregue.`);
  }
  for (const arr of Object.values(tombs || {})) for (const n of arr) { const b = S.bens[n]; if (b) { b.situacao = "ENTREGUE"; b.planoId = planoId; b.entregueEm = now(); } }
}

function formTombar(id) {
  const e = S.empenhos[id]; const itens = e.itens.filter(i => itemBens(i).length < i.qtd);
  const ini = {}; const modo = {}; const lista = {};
  const m = openModal({xl:true, title:"Gerar tombamentos · " + esc(e.numero), sub:esc(e.fornecedor || ""), body:`
    <p class="ink2" style="margin-top:0">Informe o primeiro número de cada item e o sistema gera a sequência para a quantidade. Ao preencher um item, o próximo é sugerido em seguida. Se os números não forem contínuos, use “Lista”.</p>
    <div class="row wrap" style="gap:8px;margin:10px 0"><input class="inp num" id="tb-geral" placeholder="Nº inicial para todos" style="width:200px" inputmode="numeric"><button class="btn sm" id="tb-seq">Preencher em sequência</button></div>
    <div id="tb-l"></div><p class="small" id="tb-m" style="margin-top:8px"></p>`,
    foot:`<button class="btn" data-act="close">Cancelar</button><button class="btn primary" id="tb-go">Gerar tombamentos</button>`});
  const draw = () => {
    $("#tb-l", m).innerHTML = `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Item</th><th>Descrição</th><th style="text-align:right">Sem número</th><th>Tombamentos</th></tr></thead><tbody>${itens.map(i => { const f = i.qtd - itemBens(i).length; const v = ini[i.id] || ""; return `<tr><td class="num">${i.seq}</td><td>${esc(i.descricao)}</td><td class="num" style="text-align:right">${fmtN(f)}</td><td style="min-width:260px">
      <div class="row" style="gap:6px"><div class="seg" role="group" style="flex:none"><button aria-pressed="${modo[i.id] !== "lista"}" data-tm="${i.id}" data-v="ini">Faixa</button><button aria-pressed="${modo[i.id] === "lista"}" data-tm="${i.id}" data-v="lista">Lista</button></div>
      ${modo[i.id] === "lista" ? `<textarea class="inp num" data-tl="${i.id}" rows="2" placeholder="Um número por linha ou separados por vírgula">${esc(lista[i.id] || "")}</textarea>` : `<input class="inp num" data-ti="${i.id}" value="${esc(v)}" placeholder="Nº inicial" inputmode="numeric" style="width:140px">`}</div>
      <div class="small muted" style="margin-top:4px">${modo[i.id] === "lista" ? (() => { const n = (lista[i.id] || "").split(/[\s,;]+/).filter(Boolean).length; return `${n} de ${f} números`; })() : /^\d+$/.test(v) ? `${esc(v)} a ${esc(proxNumero(v, f - 1))}` : ""}</div></td></tr>`; }).join("")}</tbody></table></div>`;
  };
  draw();
  const seq = s0 => { let n = s0; for (const i of itens) { if (modo[i.id] === "lista") continue; ini[i.id] = n; n = proxNumero(n, i.qtd - itemBens(i).length); } draw(); };
  $("#tb-seq", m).onclick = () => { const s0 = $("#tb-geral", m).value.trim(); if (!/^\d+$/.test(s0)) { toast("Digite o número inicial só com algarismos.", true); return; } seq(s0); };
  m.addEventListener("click", ev => { const b = ev.target.closest("[data-tm]"); if (b) { modo[b.dataset.tm] = b.dataset.v; draw(); } });
  m.addEventListener("change", ev => {
    const t = ev.target;
    if (t.dataset.ti) { ini[t.dataset.ti] = t.value.trim(); const k = itens.findIndex(i => i.id === t.dataset.ti); const nx = itens[k + 1]; if (nx && !ini[nx.id] && /^\d+$/.test(ini[t.dataset.ti]) && modo[nx.id] !== "lista") ini[nx.id] = proxNumero(ini[t.dataset.ti], itens[k].qtd - itemBens(itens[k]).length); draw(); }
    if (t.dataset.tl) { lista[t.dataset.tl] = t.value; draw(); }
  });
  $("#tb-go", m).onclick = async () => {
    const fx = {};
    for (const i of itens) { if (modo[i.id] === "lista") { const a = (lista[i.id] || "").split(/[\s,;]+/).filter(Boolean); if (a.length) fx[i.id] = a; } else if (ini[i.id]) fx[i.id] = ini[i.id]; }

  };
}

const LIB_PDF_W = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

async function lerArquivoEmpenho(f) {
  const ext = (f.name.split(".").pop() || "").toLowerCase(); const buf = await f.arrayBuffer();
  let linhas; // array de arrays de células
  if (ext === "pdf" || f.type === "application/pdf") linhas = await pdfLinhas(buf);
  else {
    await loadScript(LIB_XLSX);
    const wb = ext === "txt" || ext === "csv" ? XLSX.read(new TextDecoder(detectarCodificacao(buf)).decode(buf), {type:"string", raw:true}) : XLSX.read(buf, {type:"array", cellDates:true, dateNF:"dd/mm/yyyy"});
    linhas = []; wb.SheetNames.forEach(n => { linhas.push(["§ABA§"]); XLSX.utils.sheet_to_json(wb.Sheets[n], {header:1, raw:false, defval:"", dateNF:"dd/mm/yyyy"}).forEach(r => linhas.push(r.map(c => String(c ?? "").trim()))); });
  }
  const r = interpretarEmpenho(linhas, ext === "pdf");
  r.arquivo = f.name;
  if (r.grupos && r.grupos.length > 1) return r;
  if (r.grupos && r.grupos.length === 1) { r.cab = {...r.cab, ...r.grupos[0].cab}; r.itens = r.grupos[0].itens; }
  r.aviso = r.itens.length ? {t:`Lemos ${plural(r.itens.length, "item", "itens")} de ${f.name}`, d:"Confira número do empenho, quantidades e valores antes de registrar. Você pode corrigir qualquer campo."}
                           : {t:"Não encontramos a tabela de itens neste arquivo", d:"Os dados do cabeçalho que conseguimos ler já estão preenchidos. Digite os itens abaixo ou tente o arquivo em Excel."};
  return r;
}
function detectarCodificacao(buf) { try { new TextDecoder("utf-8", {fatal:true}).decode(buf); return "utf-8"; } catch (e) { return "windows-1252"; } }
async function pdfLinhas(buf) {
  await loadScript(LIB_PDF); const lib = window.pdfjsLib; lib.GlobalWorkerOptions.workerSrc = LIB_PDF_W;
  const doc = await lib.getDocument({data:new Uint8Array(buf)}).promise; const out = [];
  for (let p = 1; p <= Math.min(doc.numPages, 40); p++) {
    const tc = await (await doc.getPage(p)).getTextContent(); const rows = [];
    tc.items.forEach(it => { if (!it.str.trim()) return; const y = Math.round(it.transform[5]), x = it.transform[4]; let r = rows.find(r => Math.abs(r.y - y) <= 3); if (!r) rows.push(r = {y, cells:[]}); r.cells.push({x, w:it.width || 0, s:it.str}); });
    rows.sort((a, b) => b.y - a.y).forEach(r => { r.cells.sort((a, b) => a.x - b.x); const cs = []; let last = null; r.cells.forEach(c => { if (last && c.x - (last.x + last.w) < 6) { cs[cs.length - 1] += (c.x - (last.x + last.w) > 1.5 ? " " : "") + c.s; } else cs.push(c.s); last = c; }); out.push(cs.map(s => s.trim()).filter(Boolean)); });
  }
  if (!out.some(r => r.length)) throw new Error("o PDF não tem texto (parece digitalizado).");
  return out;
}
function interpretarEmpenho(linhas, ehPdf) {
  const texto = linhas.map(r => r.join("  ")).join("\n");
  const pega = re => { const m = texto.match(re); return m ? m[1].trim() : ""; };
  const cab = {};
  let ne = texto.match(/\b(20\d{2})\s*N\s*E\s*0*(\d{1,6})\b/i);
  cab.numero = ne ? ne[1] + "NE" + ne[2].padStart(6, "0") : pega(/empenho\s*(?:n[º°o.]*)?\s*[:\-]?\s*([0-9]{1,6}\s*\/\s*20\d{2})/i).replace(/\s/g, "");
  cab.cnpj = pega(/(\d{2}\.\d{3}\.\d{3}\/\d{4}-\d{2})/);
  cab.processo = pega(/(\d{5}\.\d{6}\/\d{4}-\d{2})/);

// ---------- pelo chat: determinar, autorizar e indeferir ----------
function chatDecisao(q, msg) {
  let nl; try { nl = nluEntender(q); } catch (e) { return null; }
  const n = nl.n || "", E = nl.ents, act = a => { if (actionAllowed(a)) msg.actions.push(a); };
  // continuação de uma determinação incompleta ("para o CCS", "30")
  if (AS.slot && n.split(" ").length <= 12 && (E.uni || E.qtd || E.mat) && !/^(AUTORIZ|ASSIN|INDEFER)/.test(n)) {
    const s = AS.slot; if (E.uni) s.uni = E.uni; if (E.qtd) s.qtd = E.qtd;
    if (E.mat) { const prev = s.mat ? new Set(s.mat.its.map(i => i.id)) : null; const exato = Object.values(S.items).find(i => normName(i.descricao) === normName(q.trim())); s.mat = exato ? {...E.mat, its:[exato]} : prev ? {...E.mat, its:E.mat.its.filter(i => prev.has(i.id))} : E.mat; if (!s.mat.its.length) s.mat = E.mat; if (s.mat.its.length === 1) s.escolhido = true; }
    return chatDeterminarMontar(s, msg);
  }
  const verboDest = /^(QUERO |GOSTARIA DE |POR FAVOR |PODE |PODERIA |VAMOS |PRECISO |PRECISAMOS |DEVEMOS )?(DESTINAR|DESTINE|DESTINA|DETERMINO|DETERMINE|DETERMINAR|MANDE|MANDAR|ENVIE|ENVIAR|ENCAMINHE|ENCAMINHAR|LIBERE|LIBERAR|REPASSE|REPASSAR|DOE|DOAR|ENTREGUE|ENTREGAR)\b|\b(FAZER|FACA|REALIZAR|ABRIR|INICIAR) (UMA |A )?DESTINACAO\b|\bQUERO (UMA |FAZER (UMA )?)?DESTINACAO\b|\bDESTINACAO DE\b/;
  if (verboDest.test(n) && (E.mat || E.cat)) {
    if (!E.qtd) { const W = {UM:1, UMA:1, DOIS:2, DUAS:2, TRES:3, QUATRO:4, CINCO:5, SEIS:6, SETE:7, OITO:8, NOVE:9, DEZ:10, VINTE:20, TRINTA:30, QUARENTA:40, CINQUENTA:50, CEM:100}; const w = n.split(" ").find(x => W[x] && n.indexOf(x) < n.indexOf((E.mat ? E.mat.txt : E.cat.toUpperCase()).split(" ")[0])); if (w) E.qtd = W[w]; }
    if (canDeterminar() || can.createPlan()) return chatDeterminarMontar({mat:E.mat, cat:E.cat, qtd:E.qtd, uni:E.uni}, msg);
    return "A destinação é determinada pela Reitoria ou pela Pró-Reitoria de Administração. Pelo seu perfil, posso mostrar o saldo e os planos.";
  }
  // autorizar / indeferir pelo chat
  const autoriza = /^(EU )?(AUTORIZ\w*|ASSIN\w*|APROV\w*|DEFIR\w*|DEFERIR|PODE AUTORIZAR|QUERO AUTORIZAR|QUERO ASSINAR|LIBERO|OK PARA)\b/.test(n);
  const indefere = /^(EU )?(INDEFER\w*|NEG\w*|REJEIT\w*|RECUS\w*|NAO AUTORIZ\w*|NAO APROV\w*|DEVOLV\w*)\b/.test(n);
  if ((autoriza || indefere) && has("PRA", "REITORIA")) {
    let P = Object.values(S.plans).filter(p => p.status === "AUTORIZACAO");
    const num = (q.match(/(\d{1,4})\s*\/\s*(20\d{2})/) || q.match(/\b(?:PD|PLANO|TERMO)\s*(\d{1,4})\b/i));
    if (num) { const k = String(+num[1]).padStart(4, "0"); P = P.filter(p => String(p.numero).includes(k + "/")); }
    else if (E.uni) P = P.filter(p => matchText(planUnitText(p), E.uni.name));
    else if (!/TODOS|TUDO|TODAS|PENDENTES/.test(n)) P = P.filter(p => can.sign(p));
    const meus = P.filter(p => can.sign(p));
    if (!P.length) return num ? "Não encontrei esse termo aguardando autorização." : "Não há termos aguardando autorização.";
    if (!meus.length) return `${plural(P.length, "Termo encontrado", "Termos encontrados")}, mas ${P.length === 1 ? "não depende" : "não dependem"} da sua assinatura agora (aguarda${P.length === 1 ? "" : "m"} ${esc(nextResp(P[0]))}).`;
    const linhas = [`${indefere ? "Para indeferir" : "Para autorizar"}, revise ${meus.length === 1 ? "o termo" : `os ${meus.length} termos`}:`];
    meus.slice(0, 4).forEach(p => {
      linhas.push(`- **${esc(p.numero)}** · ${esc(p.unidade)} · ${fmtN(planQtd(p))} bens · **${BRL.format(planTotal(p))}**`);
      linhas.push(`- Itens: ${p.itens.slice(0, 3).map(i => `${fmtN(i.qtd)} × ${esc(i.descricao)}`).join("; ")}${p.itens.length > 3 ? "…" : ""}`);
      if (p.justificativa) linhas.push(`- Justificativa: ${esc(String(p.justificativa).slice(0, 160))}`);
      act({tipo:indefere ? "indeferir" : "assinar", plano_id:p.id, rotulo:(indefere ? "Indeferir " : "Autorizar ") + p.numero});
    });
    if (meus.length > 4) linhas.push(`- e mais ${meus.length - 4}. Abra Autorizações para assinar em lote.`);
    if (!indefere && meus.length > 1) act({tipo:"abrir_tela", tela:"autorizacoes", rotulo:"Assinar em lote"});
    linhas.push(indefere ? "Ao indeferir, você informa o motivo e o plano volta encerrado." : "Ao clicar, você confirma com a senha (e o código por e-mail, quando ativo). A assinatura fica registrada no termo.");
    return linhas.join("\n");
  }
  return null;
}
function chatDeterminarMontar(s, msg) {
  const st = computeStock(); const act = a => { if (actionAllowed(a)) msg.actions.push(a); };
  const cands = (s.mat ? s.mat.its : s.cat ? Object.values(S.items).filter(i => i.categoria === s.cat) : []).filter(i => st[i.id] && st[i.id].disp > 0);
  if (cands.length > 1 && !s.escolhido) {
    s.escolhido = false; AS.slot = s;
    msg.sug = cands.slice(0, 4).map(i => i.descricao);
    return `Temos ${cands.length} opções. Qual delas?\n` + cands.slice(0, 4).map(i => `- ${esc(i.descricao)}: ${fmtN(st[i.id].disp)} disponíveis`).join("\n");
  }
  const it = cands.slice().sort((a, b) => st[b.id].disp - st[a.id].disp)[0];
  if (!it) { AS.slot = null; return "Não encontrei esse bem na reserva técnica."; }
  const disp = Math.max(0, st[it.id].disp);
  if (!s.qtd) { AS.slot = s; return `Quantos **${esc(it.descricao)}** deseja destinar? Há **${fmtN(disp)}** disponíveis.`; }
  if (!s.uni) { AS.slot = s; return `Para qual unidade vão os **${fmtN(s.qtd)} × ${esc(it.descricao)}**? (ex.: “para o CCS” ou “Biblioteca Central”)`; }
  AS.slot = null;
  if (s.qtd > disp) { if (disp > 0) AS.slot = {...s, qtd:null, sugQtd:disp}; }
  if (s.qtd > disp) return `**Não há saldo suficiente:** há ${fmtN(disp)} disponíveis de ${esc(it.descricao)}, e o pedido é de ${fmtN(s.qtd)}. Quer destinar ${fmtN(disp)}?`;
  const dados = {unidade:s.uni.name, unidadeCode:s.uni.code || "", itens:[{material_id:it.id, quantidade:s.qtd}], observacao:"", origem:"chat"};
  if (canDeterminar()) {
    act({tipo:"determinar", rotulo:"Confirmar determinação", det:dados});
    act({tipo:"determinar_ajustar", rotulo:"Ajustar antes", det:dados});
    return `Vou registrar a determinação:\n- **${fmtN(s.qtd)} × ${esc(it.descricao)}** para **${esc(s.uni.name)}**\n- Disponível hoje: ${fmtN(disp)} (ficam ${fmtN(disp - s.qtd)})\nAo confirmar, o **plano é iniciado** e os servidores da Formalização recebem o aviso por e-mail para formalizar. Depois ele volta para a sua autorização.`;
  }
  act({tipo:"criar_plano", rotulo:"Montar o plano", rascunho:{unidade:s.uni.name, unidadeCode:s.uni.code || "", finalidade:"", justificativa:"", itens:[{material_id:it.id, quantidade:s.qtd}]}});
  return `Posso montar o plano: **${fmtN(s.qtd)} × ${esc(it.descricao)}** para **${esc(s.uni.name)}** (há ${fmtN(disp)} disponíveis).`;
}

function vMonitoramento() {

  plans.forEach(p => { const e = p.etapas || []; for (let i = 0; i < e.length - 1; i++) if (dur[e[i].s]) dur[e[i].s].push((e[i + 1].at - e[i].at) / DAY); });
  const avg = STAGES.slice(0, 6).map(s => ({s, v:dur[s].length ? dur[s].reduce((a, b) => a + b, 0) / dur[s].length : 0, n:dur[s].length, sla:S.cfg.sla[s]}));

    <div class="card kpi"><div class="l">Alertas graves</div><div class="v num" style="color:var(--serious-ink)">${cnt.serious}</div><div class="d">Garantia vence em até ${S.cfg.diasGarantia} dias</div></div>
    <div class="card kpi"><div class="l">Atenção</div><div class="v num" style="color:var(--warn-ink)">${cnt.warning}</div><div class="d">Bens parados ou etapa acima do prazo</div></div>
    <div class="card kpi"><div class="l">Eventos auditados</div><div class="v num">${fmtN(plans.reduce((a, p) => a + (p.eventos || []).length, 0))}</div><div class="d">em cadeia de hash SHA-256</div></div>
  </div>
  <div class="grid g-12">
    <section class="card c-7"><div class="card-h"><h3>Alertas ativos</h3><span class="sub">${alerts.length}</span></div><div class="card-b" style="max-height:560px;overflow:auto;padding-top:10px">${alerts.map(alertHtml).join("") || '<div class="empty"><b>Nenhum alerta</b>Prazos e estoques dentro dos parâmetros.</div>'}</div></section>
    <div class="c-5" style="display:flex;flex-direction:column;gap:16px">
      <section class="card"><div class="card-h"><h3>Tempo médio por etapa</h3><span class="sub">dias, comparado ao prazo</span></div><div class="card-b"><div class="hbars">${avg.map(a => `<div class="hbar" style="grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) 64px" data-tip="${ST[a.s].l}: média de ${a.v.toFixed(1)} dias em ${plural(a.n, "passagem", "passagens")} · prazo de ${a.sla} dias"><span class="lb">${ST[a.s].short || ST[a.s].l}</span><span class="tr"><span class="fl" style="width:${(a.v / maxA * 100).toFixed(1)}%;background:${a.v > a.sla ? "var(--serious)" : "var(--s1)"}"></span><span style="position:absolute;left:${(a.sla / maxA * 100).toFixed(1)}%;top:-3px;bottom:-3px;width:2px;background:var(--ink-2)"></span></span><span class="vl num">${a.n ? a.v.toFixed(1) + " d" : "—"}</span></div>`).join("")}</div><p class="small muted" style="margin-top:10px">A linha vertical marca o prazo configurado. Barras em laranja indicam média acima do prazo.</p></div></section>

async function verifyCode(code) {
  code = code.toUpperCase().replace(/[^0-9A-F]/g, "");
  const out = $("#vres"); if (code.length < 8) { out.innerHTML = '<p class="small" style="color:var(--crit-ink)">Digite o código completo, com 12 caracteres.</p>'; return; }
  if (S.mode === "oficial") {
    try { const r = await SB.rpc("verificar_codigo", {p_codigo:code});
      if (!r || !r.encontrado) { out.innerHTML = '<div class="verify-bad"><b>Código não encontrado</b><p class="small">Nenhuma assinatura deste sistema corresponde a esse código. Confira a digitação.</p></div>'; return; }
      const ok = r.conteudo_ok && r.assinatura_ok; const p = S.plans[r.plano_id];
      out.innerHTML = `<div class="${ok ? "verify-ok" : "verify-bad"}"><b>${ok ? "Documento autêntico e íntegro" : "Atenção: divergência encontrada"}</b><p class="small" style="margin-top:6px">${esc(r.numero)} · ${esc(r.unidade)}${p ? " · " + BRL.format(planTotal(p)) : ""}<br>Assinado por ${esc(r.cargo || "")} (${esc(nameOf(r.por))}) em ${fmtDT(r.em)}</p><p class="small" style="margin-top:6px">${r.conteudo_ok ? "✔ Conteúdo idêntico ao assinado" : "✖ O conteúdo atual difere do que foi assinado"}<br>${r.assinatura_ok ? "✔ Assinatura confere com o hash, conferida no servidor" : "✖ Assinatura não confere"}</p><button class="btn sm" style="margin-top:8px" data-act="doc" data-doc="aut" data-id="${r.plano_id}">Abrir termo</button></div>`;
    } catch (e) { out.innerHTML = `<div class="verify-bad"><b>Não foi possível verificar</b><p class="small">${esc(e.message)}</p></div>`; }
    return;
  }
  for (const p of Object.values(S.plans)) {
    for (const a of Object.values(p.assinaturas || {})) {
      if (a.sig.toUpperCase().startsWith(code)) {
        const h = await sha256(docPayload(p)); const ok = h === a.docHash;
        const sigOk = await sha256(a.docHash + "|" + a.by + "|" + a.role + "|" + a.at) === a.sig;
        const stored = ((S.sigs[a.by] || {}).registros || {})[p.id + "_" + a.role];
        const regOk = !!stored && stored.sig === a.sig;
        out.innerHTML = `<div class="${ok && sigOk && regOk ? "verify-ok" : "verify-bad"}"><b>${ok && sigOk && regOk ? "Documento autêntico e íntegro" : "Atenção: divergência encontrada"}</b>
          <p class="small" style="margin-top:6px">${esc(p.numero)} · ${esc(p.unidade)} · ${BRL.format(planTotal(p))}<br>Assinado por ${esc(a.cargo)} (${esc(nameOf(a.by))}) em ${fmtDT(a.at)}</p>
          <p class="small" style="margin-top:6px">${ok ? "✔ Conteúdo idêntico ao assinado" : "✖ O conteúdo atual difere do que foi assinado"}<br>${sigOk ? "✔ Assinatura confere com o hash" : "✖ Assinatura não confere"}<br>${regOk ? "✔ Registro presente no livro de assinaturas do signatário" : "✖ Registro ausente no livro de assinaturas do signatário"}</p>
          <button class="btn sm" style="margin-top:8px" data-act="doc" data-doc="aut" data-id="${p.id}">Abrir termo</button></div>`;
        return;
      }
    }
  }
  out.innerHTML = '<div class="verify-bad"><b>Código não encontrado</b><p class="small">Nenhuma assinatura deste sistema corresponde a esse código. Confira a digitação.</p></div>';
}

// =====================================================================
// ESTRUTURA ORGANIZACIONAL (hierarquia SIPAC) — padrão UFPB embutido, substituível em Configurações
// =====================================================================
const ORG = {list:[], by:new Map(), kids:new Map(), root:null, fonte:"", atualizadoEm:null};
function loadOrg(rows, meta = {}) {
  ORG.list = rows.map(r => ({code:String(r[0]), name:String(r[1]), parent:r[2] ? String(r[2]) : ""}));
  ORG.by = new Map(ORG.list.map(u => [u.code, u])); ORG.kids = new Map();
  ORG.list.forEach(u => { const p = ORG.by.has(u.parent) ? u.parent : ""; if (!ORG.kids.has(p)) ORG.kids.set(p, []); ORG.kids.get(p).push(u); });
  ORG.kids.forEach(a => a.sort((x, y) => x.name.localeCompare(y.name, "pt-BR")));
  const roots = ORG.kids.get("") || []; ORG.root = roots.length === 1 ? roots[0].code : "";
  ORG.list.forEach(u => { u.path = []; let k = ORG.by.get(u.parent), n = 0; while (k && n++ < 20) { u.path.unshift(k.code); k = ORG.by.get(k.parent); } });
  // "contêineres": níveis que englobam quase toda a estrutura (UFPB › Conselhos Superiores › Reitoria no SIPAC)
  const size = new Map(); const sz = c => { if (size.has(c)) return size.get(c); let n = 0; for (const k of ORG.kids.get(c) || []) n += 1 + sz(k.code); size.set(c, n); return n; };
  ORG.list.forEach(u => sz(u.code));
  ORG.containers = new Set(ORG.list.filter(u => size.get(u.code) > ORG.list.length * 0.5).map(u => u.code));
  ORG.start = [...ORG.containers].map(c => ORG.by.get(c)).sort((a, b) => b.path.length - a.path.length)[0]?.code || ORG.root;
  ORG.list.forEach(u => { const chain = [...u.path, u.code].filter(c => !ORG.containers.has(c)); u.orgao = chain[0] || u.code; u.key = normName(u.name + " " + u.code); });
  ORG.fonte = meta.fonte || "Hierarquia SIPAC/UFPB"; ORG.atualizadoEm = meta.atualizadoEm || null;
}
function loadOrgDefault() { try { const d = JSON.parse($("#sipacData").textContent); loadOrg(d.u, {fonte:d.fonte, atualizadoEm:d.data}); } catch (e) { loadOrg([]); } }
const uSigla = u => { if (!u) return ""; const m = u.name.match(/\(([^()]{2,14})\)\s*$/) || u.name.match(/^([A-ZÀ-Ú0-9\/]{2,10})\s*-\s+/); return m ? m[1].trim() : ""; };
const uShort = u => { if (!u) return ""; const s = uSigla(u); return s && u.name.length > 34 ? s : u.name; };
function uPathText(code) { const u = ORG.by.get(code); if (!u) return ""; return u.path.filter(c => c !== ORG.root && !(ORG.containers && ORG.containers.has(c))).map(c => uShort(ORG.by.get(c))).join(" › "); }
function orgaoOf(code) { const u = ORG.by.get(code); return u ? ORG.by.get(u.orgao) : null; }
function subtreeCount(code) { let n = 0; const st = [...(ORG.kids.get(code) || [])]; while (st.length) { const u = st.pop(); n++; st.push(...(ORG.kids.get(u.code) || [])); } return n; }
function searchUnits(q, lim = 40) {
  const Q = normName(q); if (!Q) return [];
  const toks = Q.split(/\s+/).filter(Boolean);
  const out = [];
  for (const u of ORG.list) {
    if (u.code === ORG.root) continue;
    const hay = u.key + " " + normName(uPathText(u.code));
    if (!toks.every(t => hay.includes(t))) continue;
    const sig = normName(uSigla(u));
    const score = (normName(u.name) === Q ? 0 : sig === Q ? 1 : normName(u.name).startsWith(Q) ? 2 : u.key.includes(Q) ? 3 : 4) * 10 + u.path.length;
    out.push([score, u]);
  }
  return out.sort((a, b) => a[0] - b[0]).slice(0, lim).map(x => x[1]);
}
// casa um texto livre (ex.: destino da planilha) com uma unidade da estrutura
function matchUnit(text) {
  const T = normName(text); if (!T || !ORG.list.length) return null;
  const exact = ORG.list.find(u => normName(u.name) === T); if (exact) return exact;
  const sigs = [...String(text).matchAll(/\(([^()]{2,14})\)/g)].map(m => normName(m[1].split("/")[0])).reverse();

  const per = nluPeriodo(n); if (per) { ents.per = per; mk = mk.replace(per.re, " <PER> "); }
  const uni = nluUnidade(n, q); if (uni) { ents.uni = uni.u; mk = mk.replace(new RegExp("\\b" + uni.txt + "\\b"), " <UNI> "); }
  const excl = new Set([...(uni ? uni.txt.split(" ") : []), ...(per ? (n.match(per.re) || [""])[0].split(" ") : [])]);
  const mat = nluMaterial(n, excl);
  if (mat) { const orig = {}; String(q).split(/[^\p{L}\p{N}-]+/u).forEach(w => { if (w) orig[normName(w)] = w; }); mat.orig = mat.txt.split(" ").map(w => orig[w] || w.toLowerCase()).join(" "); }
  if (mat && mat.cat) { ents.cat = mat.cat; mk = mk.replace(new RegExp("\\b" + mat.txt + "\\b"), " <CAT> "); }
  else if (mat) { ents.mat = mat; mk = mk.replace(new RegExp("\\b" + mat.txt + "\\b"), " <MAT> "); }
  if ((m = n.match(/\b(\d{1,5})\b/)) && !ents.tomb && !(ents.plano && ents.plano.startsWith(m[1]))) { const v = +m[1]; if (v > 0 && v < 100000 && !/20\d{2}/.test(m[1])) { ents.qtd = v; mk = mk.replace(new RegExp("\\b" + m[1] + "\\b"), " <QTD> "); } }
  const sit = Object.entries({ENTREGUE:/ENTREGUES?\b(?! PARA)/, RASCUNHO:/RASCUNHO/, INSTRUCAO:/INSTRUCAO|FORMALIZ/, AUTORIZACAO:/AGUARDANDO (AUTORIZ|ASSINAT)/, AUTORIZADO:/\bAUTORIZADOS?\b/, SEPARACAO:/SEPARAC/, PRONTO:/PRONTOS?\b/, INDEFERIDO:/INDEFERID|NEGAD/, CANCELADO:/CANCELAD/}).find(([k, re]) => re.test(n));
  if (sit && /PLANO|TERMO|PROCESSO|PEDIDO/.test(n)) { ents.sit = sit[0]; mk = mk.replace(sit[1], " <SIT> "); }
  // classificação por semelhança com os modelos (palavras com peso idf + trigramas)
  const qt = nluToks(mk.trim().replace(/\s+/g, " "));
  const tri = s => { const o = new Map(); const t = " " + s + " "; for (let i = 0; i < t.length - 2; i++) { const g = t.slice(i, i + 3); o.set(g, (o.get(g) || 0) + 1); } return o; };
  const cos = (a, b) => { let d = 0, na = 0, nb = 0; a.forEach((v, k) => { na += v * v; if (b.has(k)) d += v * b.get(k); }); b.forEach(v => nb += v * v); return d / (Math.sqrt(na * nb) || 1); };
  const qs = qt.join(" "), qtri = tri(qs), qset = new Set(qt);
  const best = {};
  for (const md of NLU.modelos) {
    const es = new Set(md.toks); let inter = 0, wq = 0, we = 0;
    qset.forEach(t => { const w = NLU.idf(t); wq += w; if (es.has(t)) inter += w; }); es.forEach(t => { we += NLU.idf(t); });
    let sc = (inter / Math.sqrt((wq || 1) * (we || 1))) * 0.7 + cos(qtri, tri(md.toks.join(" "))) * 0.3;
    // coerência com as peças encontradas
    const need = md.e.match(/<\w+>/g) || [];
    need.forEach(p => { const k = {"<MAT>":"mat","<CAT>":"cat","<UNI>":"uni","<PER>":"per","<QTD>":"qtd","<SIT>":"sit"}[p]; if (!ents[k]) sc -= 0.12; else sc += 0.04; });
    if (!best[md.intent] || sc > best[md.intent].sc) best[md.intent] = {sc, e:md.e};
  }
  const rank = Object.entries(best).map(([intent, x]) => ({intent, sc:x.sc, e:x.e})).sort((a, b) => b.sc - a.sc);
  let intent = rank[0] ? rank[0].intent : null, score = rank[0] ? rank[0].sc : 0;
  // peças decisivas
  if (ents.plano) { intent = "plano_detalhe"; score = 1; }
  else if (ents.emp) { intent = "empenho_detalhe"; score = 1; }
  else if (ents.tomb && /TOMBAMENTO|PLAQUETA|PATRIMONIO|\bN\w* \d/.test(n) || ents.tomb && qt.length <= 2) { intent = "tombamento"; score = 1; }
  return {q, n, mk:mk.trim(), ents, intent, score, rank:rank.slice(0, 4), fixes:cor.fixes};
}

function conversaNormal(n, msg) {

    [/^(HAHA|KKK|RSRS|HEHE|KKKK|HAHAHA)/, () => "😄 Posso ajudar em algo da reserva?"],

    return its.length ? `**${plural(its.length, "material", "materiais")}** sem valor unitário:\n` + lista(its, it => `- ${esc(it.descricao)}`) : "Todos os materiais têm valor unitário.";
  }
  if (/ESGOTAD|SEM SALDO|ZERAD|ACABOU|ACABARAM/.test(n)) {
    const st = computeStock(); const its = Object.values(S.items).filter(it => st[it.id].disp <= 0);
    return its.length ? `**${plural(its.length, "material está", "materiais estão")}** sem saldo disponível:\n` + lista(its, it => `- ${esc(it.descricao)} (${fmtN(st[it.id].saldo)} sob guarda, todo em trâmite ou entregue)`) : "Todos os materiais têm saldo disponível.";
  }
  // h) usuários, signatários e papéis
  if (/USUARIO|SIGNATARI|QUEM ASSINA|QUEM AUTORIZA|ADMINISTRADOR|EQUIPE|PERFIS|PAPEIS/.test(n)) {
    const sg = Object.entries(S.cfg.signatarios || {}).map(([r, x]) => `- ${esc(x.cargo)}: ${esc(x.nome)}`).join("\n");
    const us = (S.perfisList || []).filter(p => p.aprovado);
    return "**Signatários**\n" + sg + `\n- Limite de alçada do Pró-Reitor: ${BRL.format(S.cfg.limiteAlcada || 0)}` + (us.length ? "\n\n**Usuários aprovados**\n" + lista(us, p => `- ${esc(p.nome || p.email)}: ${esc(p.papeis.map(r => ROLES[r] ? ROLES[r].label : r).join(", "))}`, 15) : "");
  }
  // i) entradas recentes
  if (/ENTRADA|CHEGOU|CHEGARAM|RECEBIDO|RECEBEMOS|COMPRAD|AQUISIC|EMPENHO|NOTA FISCAL|PREGAO|FORNECEDOR/.test(n)) {
    const ls = []; for (const it of Object.values(S.items)) for (const l of lotsOf(it)) if (+l.qtd > 0) ls.push({it, l});
    const termo = n.replace(/.*\b(DE|DO|DA|DOS|DAS)\s+/, "");
    let sel = ls.filter(x => matchText([x.it.descricao, x.it.fornecedor, x.it.marca, x.l.empenho, x.l.nf, x.l.pregao, x.l.processo].join(" "), termo));
    if (!sel.length) sel = ls;
    sel.sort((a, b) => (b.l.data || 0) - (a.l.data || 0));
    if (!sel.length) return "Não há entradas registradas.";
    return "**Entradas na reserva** (mais recentes primeiro):\n" + lista(sel, x => `- ${fmtD(x.l.data)} · ${fmtN(x.l.qtd)} × ${esc(x.it.descricao)}${x.l.vu ? " · " + BRL.format(x.l.vu) + " un." : ""}${x.it.fornecedor ? " · " + esc(x.it.fornecedor) : ""}${x.l.empenho ? " · empenho " + esc(x.l.empenho) : ""}${x.l.nf ? " · NF " + esc(x.l.nf) : ""}`, 10);
  }
  // 2) assinaturas pendentes
  if (/ASSINA|AUTORIZ/.test(n) && /(MINHA|AGUARD|PENDENT|FALTA|PRECISO|TENHO|QUAIS|QUE)/.test(n)) {
    const ps = Object.values(S.plans).filter(p => p.status === "AUTORIZACAO");
    const mine = ps.filter(p => can.sign(p));
    if (has("PRA","REITORIA")) {
      if (!mine.length) return "Nenhum termo aguarda a sua assinatura agora." + (ps.length ? ` Há ${plural(ps.length, "plano")} com outras autoridades.` : "");
      mine.slice(0, 3).forEach(p => act({tipo:"assinar", plano_id:p.id, rotulo:"Revisar e assinar " + p.numero}));
      return `**${plural(mine.length, "termo aguarda", "termos aguardam")}** a sua assinatura (${BRL.format(mine.reduce((a, p) => a + planTotal(p), 0))}):\n` + lista(mine, p => `- ${esc(p.numero)} · ${esc(p.unidade)} · ${BRL.format(planTotal(p))}${isLate(p) ? " · acima do prazo" : ""}`);
    }
    if (!ps.length) return "Nenhum plano aguarda autorização.";
    act({tipo:"abrir_tela", tela:"autorizacoes", rotulo:"Abrir autorizações"});
    return `**${plural(ps.length, "plano aguarda", "planos aguardam")}** autorização:\n` + lista(ps, p => `- ${esc(p.numero)} · ${esc(p.unidade)} · com ${esc((nextSigner(p) || []).map(r => S.cfg.signatarios[r].cargo).join(", "))}`);
  }
  // 3) minhas pendências
  if (/PENDENC|O QUE (EU )?(TENHO|PRECISO)|MINHAS TAREFAS|A FAZER/.test(n)) {
    const pend = myPending();
    if (!pend.length) return `Nenhuma pendência no perfil ${esc(ROLES[R()].label)}.`;
    pend.slice(0, 3).forEach(x => act({tipo:"abrir_plano", plano_id:x.p.id, rotulo:x.a + " · " + x.p.numero}));
    return `Você tem **${plural(pend.length, "pendência")}**:\n` + lista(pend, x => `- ${esc(x.a)}: ${esc(x.p.numero)} · ${esc(x.p.unidade)}${isLate(x.p) ? " · acima do prazo" : ""}`);
  }
  // 4) garantia
  if (/GARANTIA/.test(n)) {
    const st = computeStock(); const lim = now() + S.cfg.diasGarantia * DAY;
    const its = Object.values(S.items).filter(it => it.garantiaAte && it.garantiaAte < lim && st[it.id].saldo > 0).sort((a, b) => a.garantiaAte - b.garantiaAte);
    if (!its.length) return `Nenhum material em reserva com garantia vencendo nos próximos ${S.cfg.diasGarantia} dias.`;
    act({tipo:"abrir_material", material_id:its[0].id, rotulo:"Abrir " + its[0].descricao.slice(0, 40)});
    return `**${plural(its.length, "material", "materiais")}** com garantia vencida ou vencendo:\n` + lista(its, it => `- ${esc(it.descricao)}: ${it.garantiaAte < now() ? "venceu" : "vence"} em ${fmtD(it.garantiaAte)} · ${fmtN(st[it.id].saldo)} em reserva`);
  }
  // 5) parados / mais antigos
  if (/PARAD|ANTIG|ENCALH|MAIS TEMPO|SEM DESTIN/.test(n)) {
    const st = computeStock();
    const its = Object.values(S.items).filter(it => st[it.id].disp > 0).sort((a, b) => st[a.id].age - st[b.id].age);
    if (!its.length) return "Não há saldo disponível parado na reserva.";
    act({tipo:"abrir_tela", tela:"reserva", rotulo:"Ver a reserva técnica"});
    return "Saldos disponíveis há mais tempo em estoque:\n" + lista(its, it => `- ${esc(it.descricao)}: **${fmtN(st[it.id].disp)}** desde ${fmtD(st[it.id].age)} (${daysSince(st[it.id].age)} dias)`, 6);
  }
  // 6) atrasos
  if (/ATRAS|PRAZO|PARADO NA ETAPA|DEMORA/.test(n)) {
    const ps = Object.values(S.plans).filter(isLate);
    if (!ps.length) return "Nenhum plano está acima do prazo da etapa.";
    ps.slice(0, 3).forEach(p => act({tipo:"abrir_plano", plano_id:p.id, rotulo:"Abrir " + p.numero}));
    return `**${plural(ps.length, "plano está", "planos estão")}** acima do prazo:\n` + lista(ps, p => `- ${esc(p.numero)} em “${ST[p.status].l}” há ${daysSince(stageEnteredAt(p))} dias (prazo ${S.cfg.sla[p.status]}) · ${esc(p.unidade)}`);
  }
  // 7) entregas para uma unidade / de um material
  m = n.match(/(ENTREG|FOI|FORAM|DESTIN|RECEBEU|RECEBERAM).*?\bPARA\s+(O |A |OS |AS )?(.+)$/) || n.match(/^O QUE (O |A )?(.+?) RECEBEU/);
  if (m || /ENTREGU|ENTREGAS/.test(n)) {
    const uni = m ? (m[3] || m[2] || "").replace(/\b(ESTE|ESSE|NESTE|NESSE) (MES|ANO)\b.*$/, "").trim() : "";
    const dias = /ESTE MES|ESSE MES|NESTE MES|NESSE MES/.test(n) ? new Date().getDate() : /ESTE ANO|ESSE ANO|NESTE ANO/.test(n) ? Math.ceil((now() - new Date(new Date().getFullYear(), 0, 1)) / DAY) : 0;
    const r = tConsultarDestinacoes({unidade:uni, dias});
    if (!r.registros) return `Não encontrei entregas${uni ? " para “" + esc(uni.toLowerCase()) + "”" : ""}${dias ? " no período" : ""}.`;
    return `**${fmtN(r.total_unidades)} bens** entregues${uni ? " para “" + esc(uni.toLowerCase()) + "” (incluindo subunidades)" : ""}${dias ? " no período" : ""}:\n` + lista(r.entregas, e => `- ${e.data} · ${fmtN(e.quantidade)} × ${esc(e.material)} → ${esc(e.unidade)}${e.historico ? " (histórico)" : ""}`);
  }
  // 7b) maiores estoques / maiores valores
  if (/MAIOR(ES)? (ESTOQUE|SALDO|QUANTIDADE|VALOR)|MAIS (ITENS|BENS|ESTOQUE|SALDO|VALIOSO)|RANKING|\bTOP\b|MAIS TEM|QUE MAIS (TEM|HA|SOBRA)/.test(n)) {
    const st = computeStock(); const porValor = /VALOR|VALIOS|CARO|R\$/.test(n);
    const its = Object.values(S.items).filter(it => st[it.id] && st[it.id].saldo > 0)
      .map(it => ({it, saldo:st[it.id].saldo, disp:st[it.id].disp, valor:st[it.id].saldo * (+it.valorUnitario || 0)}))
      .sort((a, b) => porValor ? b.valor - a.valor : b.saldo - a.saldo);
    if (!its.length) return "A reserva técnica está sem saldo no momento.";
    act({tipo:"abrir_tela", tela:"reserva", rotulo:"Ver a reserva técnica"});
    return `Itens com ${porValor ? "maior valor" : "maior estoque"} na reserva:\n` + lista(its, x => `- ${esc(x.it.descricao)}: **${fmtN(x.saldo)}** sob guarda (${fmtN(x.disp)} disponíveis)${x.valor ? " · " + BRL.format(x.valor) : ""}`, 10);
  }
  // 8) quantidade de um material
  m = n.match(/QUANT[OA]S?\s+(.+?)(\s+(TEMOS|TEM|HA|EXISTEM|ESTAO|DISPONIVE\w*|NA RESERVA|EM ESTOQUE|SOBRARAM|RESTAM)\b.*)?$/) || n.match(/(SALDO|ESTOQUE) DE\s+(.+)$/);
  if (m) {
    const termo = (m[2] && !/^\s/.test(m[2]) ? m[2] : m[1]).replace(/^(DE|DO|DA|OS|AS)\s+/, "").trim();
    const r = tConsultarEstoque({termo});
    if (r.encontrados) {
    act({tipo:"abrir_tela", tela:"reserva", busca:termo.toLowerCase(), rotulo:"Ver na reserva técnica"});
    return `Há **${fmtN(r.totais.disponivel)}** disponíveis para destinar (${fmtN(r.totais.sob_guarda)} sob guarda)${r.totais.em_tramite ? `, com ${fmtN(r.totais.em_tramite)} em trâmite` : ""}:\n` + lista(r.materiais, x => `- ${esc(x.descricao)}: **${fmtN(x.disponivel)}**`);
    }
  }
  // 9) visão geral
  if (/RESUMO|VISAO GERAL|COMO ESTA|SITUACAO|PANORAMA|INDICADOR/.test(n)) {
    const k = tIndicadores();
    return `**Resumo da reserva técnica**\n- ${fmtN(k.bens_disponiveis)} bens disponíveis (${BRL.format(k.valor_disponivel_conhecido)} com valor conhecido)\n- ${fmtN(k.bens_sob_guarda)} bens sob guarda em ${fmtN(k.materiais)} materiais\n- Planos: ${Object.entries(k.planos_por_etapa).filter(([, v]) => v).map(([e, v]) => `${v} ${e.toLowerCase()}`).join(", ") || "nenhum"}\n- ${k.planos_acima_do_prazo.length} acima do prazo · ${k.alertas.length} alertas ativos`;
  }
  // j) busca geral em materiais, planos e unidades
  {
    const STOP = new Set("O A OS AS UM UMA UNS UMAS DE DO DA DOS DAS EM NO NA NOS NAS POR PARA PRA COM SEM E OU QUE QUAL QUAIS QUANTO QUANTA QUANTOS QUANTAS COMO ONDE QUANDO QUEM TEM TEMOS TER HA EXISTE EXISTEM ESTA ESTAO ME MOSTRE MOSTRA MOSTRAR LISTE LISTA LISTAR SOBRE INFORMACAO INFORMACOES DADOS DADO SISTEMA DESTINA RESERVA TECNICA ESTOQUE QUERO SABER VOCE PODE PODERIA DIGA FALE ME SAO SER FOI FORAM ITEM ITENS MATERIAL MATERIAIS BEM BENS TUDO TODOS TODAS ALGUM ALGUMA AINDA JA MAIS MENOS MUITO NOSSO NOSSA FAVOR POR FAVOR OLA OI BOM DIA TARDE NOITE DETALHES DETALHE".split(" "));
    const toks = n.split(/[^A-Z0-9]+/).filter(t => t.length > 1 && !STOP.has(t));
    if (toks.length) {
      const st = computeStock();
      const score = hay => toks.reduce((a, t) => a + (matchText(hay, t) ? 1 : 0), 0);
      const best = (arr, f) => { const sc = arr.map(x => [score(f(x)), x]).filter(x => x[0] > 0); const mx = Math.max(0, ...sc.map(x => x[0])); return sc.filter(x => x[0] === mx).map(x => x[1]); };
      const mats = best(Object.values(S.items), it => [it.descricao, it.especificacao, it.categoria, it.marca, it.modelo, it.fornecedor, it.localizacao, it.codigo, it.obs].join(" "));
      const pls = best(Object.values(S.plans), p => [p.numero, p.unidade, planUnitText(p), p.finalidade, p.justificativa, p.processo, ST[p.status].l, ...(p.itens || []).map(i => i.descricao), p.entrega ? p.entrega.recebedor + " " + (p.entrega.local || "") : ""].join(" "));
      const uns = searchUnits(toks.join(" "), 3);
      const parts = [];
      if (mats.length) {
        mats.sort((a, b) => st[b.id].saldo - st[a.id].saldo);
        if (mats.length === 1) act({tipo:"abrir_material", material_id:mats[0].id, rotulo:"Abrir " + mats[0].descricao.slice(0, 40)});
        else act({tipo:"abrir_tela", tela:"reserva", busca:toks.join(" ").toLowerCase(), rotulo:"Ver na reserva técnica"});
        parts.push(`**Materiais** (${mats.length}):\n` + lista(mats, it => `- ${esc(it.descricao)}: **${fmtN(st[it.id].disp)}** disponíveis, ${fmtN(st[it.id].saldo)} sob guarda, ${fmtN(st[it.id].ent)} entregues${it.localizacao ? " · local: " + esc(it.localizacao) : ""}${it.valorUnitario ? " · " + BRL.format(it.valorUnitario) + " un." : ""}`, 6));
      }
      if (pls.length) {
        pls.sort((a, b) => b.criadoEm - a.criadoEm);
        if (pls.length <= 3) pls.forEach(p => act({tipo:"abrir_plano", plano_id:p.id, rotulo:"Abrir " + p.numero}));
        parts.push(`**Planos** (${pls.length}):\n` + lista(pls, plRow, 6));
      }
      if (uns.length && !pls.length) parts.push("**Unidades na estrutura da UFPB**:\n" + uns.map(u => `- ${esc(u.name)}${uPathText(u.code) ? " · " + esc(uPathText(u.code)) : ""}`).join("\n"));
      if (parts.length) return parts.join("\n\n");
    }
  }
  return null;
}

const VOZ = {rec:null, on:false, ler:lsGet("destina_voz_ler") === "1", ok:!!(window.SpeechRecognition || window.webkitSpeechRecognition), fala:!!window.speechSynthesis};
function vozOuvir() {
  if (!VOZ.ok) { toast("Este navegador não reconhece voz. Use o Chrome, o Edge ou o Safari.", true); return; }
  if (VOZ.on) { if (VOZ.rec) VOZ.rec.stop(); return; }
  if (AS.busy) return;
  if (VOZ.fala) speechSynthesis.cancel();
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition; const r = new SR(); VOZ.rec = r;
  r.lang = "pt-BR"; r.interimResults = true; r.continuous = false; r.maxAlternatives = 1;
  let ouvido = "";

  r.onerror = e => { const m = {"not-allowed":"Permita o uso do microfone para este site (ícone ao lado do endereço).", "service-not-allowed":"Permita o uso do microfone para este site.", "no-speech":"Não ouvi nada. Toque no microfone e fale de novo.", "audio-capture":"Nenhum microfone encontrado neste aparelho.", "network":"O reconhecimento de voz precisa de internet."}[e.error]; if (m) toast(m, true); };
  r.onend = () => { VOZ.on = false; VOZ.rec = null; const t = ouvido.trim(); const inp = $("#as-in"); if (t && inp) inp.value = ""; drawChat(); if (t) askAssistant(t, {voz:true}); };
  VOZ.on = true; drawChat();
  try { r.start(); } catch (e) { VOZ.on = false; VOZ.rec = null; drawChat(); }
}
function vozFalar(t) {
  if (!VOZ.ler || !VOZ.fala || !t) return;
  const txt = String(t).replace(/\*\*/g, "").replace(/^\s*-\s+/gm, "").replace(/ · /g, ", ").replace(/ × /g, " de ").replace(/\n+/g, ". ").slice(0, 1200);
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(txt); u.lang = "pt-BR"; u.rate = 1.05;
  const v = speechSynthesis.getVoices().find(x => /^pt[-_]BR/i.test(x.lang)); if (v) u.voice = v;
  speechSynthesis.speak(u);
}
if (VOZ.fala) { try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices(); } catch (e) {} }
// ---------- IA de verdade no ambiente oficial: modelo chamado pela função "assistente" do Supabase ----------
// As ferramentas rodam aqui no navegador, com os dados que o usuário já pode ver; a chave do modelo fica no servidor.
async function iaRemota(turns, {signal, tools} = {}) {
  const system = turns[0].content;
  const msgs = turns.slice(1).map(t => ({role:t.role, content:t.content}));
  const defs = (tools || []).map(t => ({name:t.name, description:t.description, input_schema:t.inputSchema || {type:"object", properties:{}}}));
  let text = "";
  for (let volta = 0; volta < 8; volta++) {
    const tok = await SB.token(); if (!tok) { const e = new Error("Sessão expirada. Entre de novo."); e.code = "ia_erro"; throw e; }
    const r = await fetch(SB.url + "/functions/v1/assistente", {method:"POST", signal, headers:{Authorization:"Bearer " + tok, apikey:SB.key, "Content-Type":"application/json"}, body:JSON.stringify({system, messages:msgs, tools:defs})});
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { const e = new Error(j.erro || "Erro " + r.status + " no assistente."); e.code = r.status === 429 ? "rate_limited" : (r.status === 404 || r.status === 503 || j.codigo === "sem_chave") ? "ia_indisponivel" : "ia_erro"; throw e; }
    const blocos = j.content || [];
    msgs.push({role:"assistant", content:blocos});
    const t = blocos.filter(b => b.type === "text").map(b => b.text).join("\n").trim(); if (t) text = t;
    const usos = blocos.filter(b => b.type === "tool_use");
    if (!usos.length) break;
    const res = [];
    for (const u of usos) {
      const f = (tools || []).find(x => x.name === u.name); let out;
      try { out = f ? await f.execute(u.input || {}) : {erro:"Ferramenta desconhecida: " + u.name}; } catch (e) { out = {erro:e.message}; }
      res.push({type:"tool_result", tool_use_id:u.id, content:JSON.stringify(out === undefined ? {ok:true} : out).slice(0, 60000)});
    }
    msgs.push({role:"user", content:res});
    if (volta === 7) text = text || "Precisei de muitas consultas para essa pergunta. Tente perguntar de forma mais específica.";
  }
  return {text:text || "Não consegui formular uma resposta. Tente reformular a pergunta."};
}
iaRemota.limits = async () => ({tools:true});
async function askAssistant(text, opts = {}) {

  AS.busy = true; AS.status = "Pensando"; drawChat();

  if (!AS.sample) { try { AS.sample = await claude.use("sample"); } catch (e) { AS.sample = null; } }
  if (!AS.sample) {
    msg.text = localAnswer(text, msg).replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&amp;/g, "&"); msg.pending = false; AS.busy = false; AS.status = ""; msg.local = true;
    logAssist({tipo:"resposta", texto:msg.text.replace(/\*\*/g, "")}); drawChat(); vozFalar(msg.text); return;
  }

      res = await AS.sample([...turns.slice(0, -1), {role:"user", content:"Dados atuais calculados pelo sistema (use-os para os números):\n" + ctx + "\n\nPergunta: " + text}], {signal:AS.ctl.signal, modelTier:"quick", cache:false, onText:({text}) => { msg.text = text; AS.status = ""; drawChat(); }});

    case "det-nova": formDeterminacao(); break;
    case "det-plano": detMontarPlano(id); break;
    case "det-cancelar": { const d = S.determ[id]; const m = openModal({title:"Cancelar a determinação " + esc(d.numero) + "?", body:`<div class="field"><label>Motivo <span class="muted">(opcional)</span></label><input class="inp" id="dc-m"></div>`, foot:`<button class="btn" data-act="close">Voltar</button><button class="btn danger" id="dc-go">Cancelar determinação</button>`}); $("#dc-go", m).onclick = async () => { if (await detDo("cancelar", {p_id:id, p_motivo:$("#dc-m", m).value.trim()}, "Determinação cancelada.")) closeModal(); }; break; }
    case "emp-novo": closeModal(); formEmpenho(); break;
    case "emp-import": formImportarEmpenho(); break;
    case "emp-st": S.ui.empSt = id; render(); break;
    case "emp-abrir": abrirEmpenho(id); break;
    case "emp-enc": if (await empDo("encaminhar", {p_id:id}, "Processo encaminhado à Divisão de Patrimônio.")) { closeModal(); setTimeout(() => abrirEmpenho(id), 200); } break;
    case "emp-tombar": closeModal(); formTombar(id); break;
    case "emp-agendar": closeModal(); formAgendar(id); break;
    case "emp-concluir": closeModal(); formConcluir(id); break;
    case "emp-csv": empCsv(id); break;
    case "emp-excluir": { const e = S.empenhos[id]; const m = openModal({title:"Excluir o registro do empenho " + esc(e.numero) + "?", body:`<p class="ink2">Os ${fmtN(empQtd(e))} bens saem do saldo da reserva e os tombamentos gerados para ele são apagados. Use só para corrigir um registro feito por engano.</p>`, foot:`<button class="btn" data-act="close">Cancelar</button><button class="btn danger" id="ex-go">Excluir registro</button>`}); $("#ex-go", m).onclick = async () => { if (await empDo("excluir", {p_id:id}, "Registro do empenho excluído.")) closeModal(); }; break; }
    case "ext-add": { const v = ($("#ext-mail") || {}).value || ""; if (await sbDo("autorizar_email", {p_email:v}, "E-mail autorizado a se cadastrar.")) sbCarregarExternos(); break; }
    case "ext-del": { if (await sbDo("remover_email", {p_email:id}, "Autorização removida. A conta já criada continua valendo.")) sbCarregarExternos(); break; }
    case "backup": sbBackup(); break;
    case "reset-demo": { const m = openModal({title:"Restaurar demonstração", body:"<p>Tudo o que foi feito na demonstração neste navegador será substituído pelo cenário de exemplo.</p>", foot:`<button class="btn" data-act="close">Voltar</button><button class="btn danger" id="go">Restaurar</button>`}); $("#go", m).onclick = async () => { S.cfg = CFG_DEFAULT(); S.cfg.signatarios = {PRA:{nome:"Prof. Ricardo Albuquerque", cargo:"Pró-Reitor de Administração"}, REITORIA:{nome:"Prof.ª Helena Cavalcanti", cargo:"Reitora"}}; await seedDemo(); closeModal(); renderShell(); render(); toast("Demonstração restaurada."); }; break; }
    case "rm-user": { const p = clone(S.perfis); delete p[id]; await persistPerfis(p); render(); break; }
  }
});
document.addEventListener("submit", e => { if (e.target.id === "f-auth") { e.preventDefault(); sbSubmitAuth(e.target); } });
document.addEventListener("change", async e => {
  const el = e.target;
  if (el.dataset.sbp) { sbSalvarPerfil(el.dataset.sbp); return; }
  if (el.dataset.ui && el.tagName === "SELECT") { S.ui[el.dataset.ui] = el.value; render(); }
  if (el.dataset.perf) { const p = clone(S.perfis); const arr = new Set(p[el.dataset.perf] || []); el.checked ? arr.add(el.dataset.r) : arr.delete(el.dataset.r); p[el.dataset.perf] = [...arr]; await persistPerfis(p); applyMyRoles(); }
});
let qT = null;
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.ui && el.tagName === "INPUT") { S.ui[el.dataset.ui] = el.value; clearTimeout(qT); qT = setTimeout(() => { const pos = el.selectionStart; const k = el.dataset.ui; render(); const n = $(`[data-ui="${k}"]`); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (x) {} } }, 180); }
  if (el.id === "usr-q") userSearch(el.value);
});
document.addEventListener("focusin", e => { if (e.target.id === "usr-q") userSearch(e.target.value); });
async function userSearch(q) {
  const box = $("#usr-res"); if (!box || !CAP.user) return;
  const hits = await CAP.user.search(q || "");
  box.style.display = hits.length ? "block" : "none";
  box.innerHTML = "";
  hits.forEach(h => { const d = document.createElement("div"); d.className = "opt"; const b = document.createElement("b"); b.textContent = h.name; const s = document.createElement("span"); s.className = "small muted"; s.textContent = S.perfis[h.id] ? "já cadastrado" : "adicionar"; d.append(b, document.createTextNode(" "), s);
    d.onclick = async () => { NAMES[h.id] = h.name; if (!S.perfis[h.id]) { const p = clone(S.perfis); p[h.id] = ["CONSULTA"]; await persistPerfis(p); } box.style.display = "none"; render(); toast(h.name + " adicionado com perfil de consulta. Marque os perfis na tabela."); };
    box.appendChild(d); });
}
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); openCmd(); }
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "j") { e.preventDefault(); AS.open ? closeChat() : openChat(); }
  else if (e.key === "Escape") { if ($("#modal-root").innerHTML) closeModal(); else if (AS.open) closeChat(); }
  else if (e.key === "Enter" && e.target.matches('[role="button"][data-act]')) e.target.click();
});

boot();
</script>
</body>
</html>
