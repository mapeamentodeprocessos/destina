# Cópia de segurança semanal do banco do Destina, criptografada.
# Precisa de dois segredos do repositório (Settings > Secrets and variables > Actions):
#   SUPABASE_DB_URL  - texto de conexão "Session pooler" do Supabase, com a senha do banco
#   BACKUP_SENHA     - senha usada para criptografar a cópia (guarde-a; sem ela a cópia não abre)
# A cópia fica em Actions > (execução) > Artifacts por 90 dias.
# Para abrir: gpg -d destina-AAAA-MM-DD.dump.gpg > destina.dump   e   pg_restore -l destina.dump
name: Cópia de segurança semanal
on:
  schedule:
    - cron: "23 6 * * 1"   # segundas, 03h23 em João Pessoa
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SENHA: ${{ secrets.BACKUP_SENHA }}
    steps:
      - name: Conferir segredos
        run: |
          if [ -z "$DB_URL" ] || [ -z "$SENHA" ]; then
            echo "::warning::Cadastre os segredos SUPABASE_DB_URL e BACKUP_SENHA para ativar a cópia semanal."
            echo "PULAR=1" >> "$GITHUB_ENV"
          fi
      - name: Instalar pg_dump 17
        if: env.PULAR != '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
      - name: Gerar e criptografar a cópia
        if: env.PULAR != '1'
        run: |
          D=$(date +%F)
          /usr/lib/postgresql/17/bin/pg_dump "$DB_URL" --schema=public --no-owner --no-privileges -Fc -f destina.dump
          gpg --batch --yes --pinentry-mode loopback --passphrase "$SENHA" --symmetric --cipher-algo AES256 -o "destina-$D.dump.gpg" destina.dump
          rm destina.dump
          ls -lh destina-*.gpg
      - uses: actions/upload-artifact@v4
        if: env.PULAR != '1'
        with:
          name: destina-backup
          path: destina-*.dump.gpg
          retention-days: 90
